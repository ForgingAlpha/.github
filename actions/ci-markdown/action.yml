# Composite action: Markdown linting.
#
# Runs the shared Markdown policy with a pinned markdownlint-cli2 version.
#
# Usage:
#
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 10
#       steps:
#         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
#         - uses: ForgingAlpha/.github/actions/ci-markdown@v1

name: CI Markdown
description: "Linux Markdown CI: all tracked inputs under repo policy; unsupported or unreadable paths fail"

inputs:
  config-path:
    description: "Path to markdownlint-cli2 config"
    required: false
    default: ".markdownlint-cli2.yaml"
  node-version:
    description: "Node.js version for markdownlint-cli2"
    required: false
    default: "24"

runs:
  using: composite
  steps:
    - name: Setup Node.js (${{ inputs.node-version }})
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node-version }}

    - name: Run Markdown lint
      env:
        MARKDOWN_CONFIG_PATH: ${{ inputs.config-path }}
      run: node "$GITHUB_ACTION_PATH/scripts/lint_markdown.mjs"
      shell: bash
