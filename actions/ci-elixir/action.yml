# Composite action: Elixir CI checks.
#
# Runs the standard Elixir/Phoenix CI gate. The Postgres service MUST be
# declared in the calling workflow's job when the consumer repo needs a
# database, because composite actions cannot define services.
#
# Usage (in the consuming repo's .github/workflows/ci.yml):
#
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 30
#       services:
#         postgres:
#           image: postgres:15
#           env:
#             POSTGRES_USER: postgres
#             POSTGRES_PASSWORD: postgres
#             POSTGRES_DB: test
#           ports:
#             - 5432:5432
#           options: >-
#             --health-cmd pg_isready
#             --health-interval 10s
#             --health-timeout 5s
#             --health-retries 5
#       env:
#         MIX_ENV: test
#         DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
#       steps:
#         - uses: actions/checkout@v7
#         - uses: ForgingAlpha/.github/actions/ci-elixir@v1
#           with:
#             elixir-version: "1.20"
#             otp-version: "29"
#             extra-checks-command: "<repo-owned extra check command>"
#             pre-test-command: "<repo-owned pre-test setup command>"
#             test-command: "<repo-owned test command>"

name: CI Elixir
description: "Elixir CI: deps, format, compile strict, credo strict, tests"

inputs:
  elixir-version:
    description: "Elixir version"
    required: false
    default: "1.20"
  otp-version:
    description: "Erlang/OTP version"
    required: false
    default: "29"
  extra-checks-command:
    description: "Optional repo-specific strict checks to run after compile and before Credo"
    required: false
    default: ""
  pre-test-command:
    description: "Optional repo-specific setup command to run immediately before tests"
    required: false
    default: ""
  test-command:
    description: "Repo-specific test command"
    required: false
    default: "mix test"

runs:
  using: composite
  steps:
    - name: Enforce merge flow
      uses: ForgingAlpha/.github/actions/ci-merge-flow@v1

    - name: Setup Elixir / OTP
      uses: erlef/setup-beam@54075bcc5e249e4758d363f27d099f55d843f124 # v1.24.1
      with:
        elixir-version: ${{ inputs.elixir-version }}
        otp-version: ${{ inputs.otp-version }}

    - name: Cache deps + build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ inputs.elixir-version }}-${{ inputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ inputs.elixir-version }}-${{ inputs.otp-version }}-
          ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get
      shell: bash

    - name: Check formatting
      run: mix format --check-formatted
      shell: bash

    - name: Compile (warnings as errors)
      run: mix compile --warnings-as-errors
      shell: bash

    - name: Extra strict checks
      if: ${{ inputs.extra-checks-command != '' }}
      run: ${{ inputs.extra-checks-command }}
      shell: bash

    - name: Credo (strict)
      run: mix credo --strict
      shell: bash

    - name: Pre-test setup
      if: ${{ inputs.pre-test-command != '' }}
      run: ${{ inputs.pre-test-command }}
      shell: bash

    - name: Run tests
      run: ${{ inputs.test-command }}
      shell: bash
