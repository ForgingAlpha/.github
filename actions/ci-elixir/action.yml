# Composite action: Elixir CI checks.
#
# Mirrors the steps in turnkeyleads-app and whosyouragent-app. The Postgres
# service MUST be declared in the calling workflow's job (composite actions
# cannot define services). See usage example below.
#
# Usage (in the consuming repo's .github/workflows/ci.yml):
#
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 30
#       services:
#         postgres:
#           image: postgres:15
#           env:
#             POSTGRES_USER: postgres
#             POSTGRES_PASSWORD: postgres
#             POSTGRES_DB: test
#           ports:
#             - 5432:5432
#           options: >-
#             --health-cmd pg_isready
#             --health-interval 10s
#             --health-timeout 5s
#             --health-retries 5
#       env:
#         MIX_ENV: test
#         DATABASE_URL: postgres://postgres:postgres@localhost:5432/test
#       steps:
#         - uses: actions/checkout@v6
#         - uses: ForgingAlpha/.github/actions/ci-elixir@v1
#           with:
#             elixir-version: "1.19"
#             otp-version: "28"
#             extra-checks-command: mix boundary.strict
#             pre-test-command: psql -h localhost -U postgres -d postgres -v ON_ERROR_STOP=1 -f infrastructure/ci/init-users.sql
#             test-command: mix test.core

name: CI Elixir
description: "Elixir CI: deps, format, compile strict, credo strict, tests"

inputs:
  elixir-version:
    description: "Elixir version"
    required: false
    default: "1.18"
  otp-version:
    description: "Erlang/OTP version"
    required: false
    default: "27"
  extra-checks-command:
    description: "Optional repo-specific strict checks to run after compile and before Credo"
    required: false
    default: ""
  pre-test-command:
    description: "Optional repo-specific setup command to run immediately before tests"
    required: false
    default: ""
  test-command:
    description: "Repo-specific test command"
    required: false
    default: "mix test"

runs:
  using: composite
  steps:
    - name: Enforce merge flow
      uses: ForgingAlpha/.github/actions/ci-merge-flow@main

    - name: Setup Elixir / OTP
      uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1
      with:
        elixir-version: ${{ inputs.elixir-version }}
        otp-version: ${{ inputs.otp-version }}

    - name: Cache deps + build
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ inputs.elixir-version }}-${{ inputs.otp-version }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ inputs.elixir-version }}-${{ inputs.otp-version }}-
          ${{ runner.os }}-mix-

    - name: Install dependencies
      run: mix deps.get
      shell: bash

    - name: Check formatting
      run: mix format --check-formatted
      shell: bash

    - name: Compile (warnings as errors)
      run: mix compile --warnings-as-errors
      shell: bash

    - name: Extra strict checks
      if: ${{ inputs.extra-checks-command != '' }}
      run: ${{ inputs.extra-checks-command }}
      shell: bash

    - name: Credo (strict)
      run: mix credo --strict
      shell: bash

    - name: Pre-test setup
      if: ${{ inputs.pre-test-command != '' }}
      run: ${{ inputs.pre-test-command }}
      shell: bash

    - name: Run tests
      run: ${{ inputs.test-command }}
      shell: bash
