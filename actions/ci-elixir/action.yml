name: CI Elixir
description: "Locked Elixir CI with full, static, and lean test profiles"

inputs:
  profile:
    description: "CI profile: full, static, or test"
    required: false
    default: "full"
  extra-checks-command:
    description: "Optional repo-owned strict checks for full/static profiles"
    required: false
    default: ""
  pre-test-command:
    description: "Optional repo-owned setup immediately before tests"
    required: false
    default: ""
  test-command:
    description: "Repo-owned test command for full/test profiles"
    required: false
    default: "mix test"
  github-actions-mode:
    description: "GitHub Actions safety mode (changed|all)"
    required: false
    default: "changed"

runs:
  using: composite
  steps:
    - name: Validate CI profile and runtime lock
      shell: bash
      env:
        PROFILE: ${{ inputs.profile }}
      run: |
        set -euo pipefail
        case "${PROFILE}" in
          full|static|test) ;;
          *)
            echo "✗ Unsupported Elixir CI profile '${PROFILE}'."
            echo "  WHY: shared CI has exactly full, static, and test execution contracts."
            echo "  HOW: set profile to full, static, or test."
            exit 1
            ;;
        esac
        for file in mise.toml mise.lock mix.exs mix.lock; do
          if [ ! -f "${file}" ]; then
            echo "✗ Required locked-runtime file '${file}' is missing."
            echo "  WHY: CI and local development must resolve the same exact runtime and dependencies."
            echo "  HOW: commit ${file} and regenerate mise.lock with the approved mise version."
            exit 1
          fi
        done
        python3 - <<'PY'
        import sys
        import tomllib

        with open("mise.lock", "rb") as lock_file:
            lock = tomllib.load(lock_file)

        missing = []
        for tool_name, entries in lock.get("tools", {}).items():
            if not isinstance(entries, list):
                entries = [entries]
            for entry in entries:
                version = entry.get("version", "unknown")
                for platform, artifact in entry.get("platforms", {}).items():
                    if artifact.get("url") and not artifact.get("checksum"):
                        missing.append(f"{tool_name}@{version} {platform}")

        if missing:
            print("✗ mise.lock contains downloaded artifacts without checksums:", file=sys.stderr)
            for artifact in missing:
                print(f"  - {artifact}", file=sys.stderr)
            print("  WHY: exact versions without integrity checks do not prevent artifact substitution.", file=sys.stderr)
            print("  HOW: regenerate the lock with checksums or add the publisher-provided SHA-256 values.", file=sys.stderr)
            raise SystemExit(1)
        PY

    - name: Enforce merge flow
      if: ${{ inputs.profile != 'test' && github.repository != 'ForgingAlpha/.github' }}
      uses: ForgingAlpha/.github/actions/ci-merge-flow@v1

    - name: Validate Alpha Apps policy
      if: ${{ inputs.profile != 'test' && github.repository != 'ForgingAlpha/.github' }}
      uses: ForgingAlpha/.github/actions/ci-alphaapps-policy@v1

    - name: Validate Markdown
      if: ${{ inputs.profile != 'test' && github.repository != 'ForgingAlpha/.github' }}
      uses: ForgingAlpha/.github/actions/ci-markdown@v1

    - name: Plan GitHub Actions safety gate
      if: ${{ inputs.profile != 'test' }}
      id: github_actions_safety
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_ACTIONS_MODE: ${{ inputs.github-actions-mode }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail
        emit_run() { echo "run=$1" >> "${GITHUB_OUTPUT}"; }
        if [ "${REPOSITORY}" = "ForgingAlpha/.github" ]; then emit_run false; exit 0; fi
        case "${GITHUB_ACTIONS_MODE}" in changed|all) ;; *) echo "✗ github-actions-mode must be changed or all."; exit 1;; esac
        if [ "${GITHUB_ACTIONS_MODE}" = "all" ]; then emit_run true; exit 0; fi
        range=""
        if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_REF}" ]; then
          git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null || {
            echo "✗ origin/${BASE_REF} is unavailable for changed-file validation."
            echo "  HOW: run actions/checkout fetch-depth: 0 before ci-elixir."
            exit 1
          }
          range="origin/${BASE_REF}...HEAD"
        elif [ -n "${EVENT_BEFORE}" ] && [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
          git rev-parse --verify --quiet "${EVENT_BEFORE}^{commit}" >/dev/null || {
            echo "✗ Push comparison SHA ${EVENT_BEFORE} is unavailable."
            echo "  HOW: run actions/checkout fetch-depth: 0 before ci-elixir."
            exit 1
          }
          range="${EVENT_BEFORE}..HEAD"
        elif git rev-parse --verify --quiet HEAD^ >/dev/null; then
          range="HEAD^..HEAD"
        else
          emit_run true
          exit 0
        fi
        workflow_action_paths=(
          ".github/workflows/*.yml"
          ".github/workflows/*.yaml"
          "action.yml"
          "action.yaml"
          "actions/*/action.yml"
          "actions/*/action.yaml"
          ".github/actions/*/action.yml"
          ".github/actions/*/action.yaml"
        )
        if ! changed_paths="$(git diff --name-only --diff-filter=ACMR "${range}" -- "${workflow_action_paths[@]}")"; then
          echo "✗ Failed to compute changed workflow/action files."
          echo "  WHY: changed-mode detection must fail closed before deciding whether to run validation."
          echo "  HOW: verify the comparison ref is fetched and rerun with actions/checkout fetch-depth: 0."
          exit 1
        fi

        changed=false
        while IFS= read -r path; do
          [ -n "${path}" ] || continue
          changed=true
          break
        done <<<"${changed_paths}"
        if [ "${changed}" = true ]; then emit_run true; else emit_run false; fi

    - name: Validate GitHub Actions safety
      if: ${{ inputs.profile != 'test' && steps.github_actions_safety.outputs.run == 'true' }}
      uses: ForgingAlpha/.github/actions/ci-github-actions@v1

    - name: Validate Dependabot coverage
      if: ${{ inputs.profile != 'test' && github.repository != 'ForgingAlpha/.github' }}
      uses: ForgingAlpha/.github/actions/ci-dependabot-coverage@v1

    - name: Review dependency changes
      if: ${{ inputs.profile != 'test' && github.repository != 'ForgingAlpha/.github' && github.event_name == 'pull_request' }}
      uses: ForgingAlpha/.github/actions/ci-dependency-review@v1

    - name: Install exact locked runtime
      uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      with:
        version: 2026.8.3
        install: true
        install_args: --locked
        cache: true

    - name: Record resolved runtime
      id: runtime
      shell: bash
      run: |
        set -euo pipefail
        mise current
        elixir_version="$(elixir -e 'IO.write(System.version())')"
        otp_version="$(elixir -e 'IO.write(System.otp_release())')"
        echo "elixir=${elixir_version}" >> "${GITHUB_OUTPUT}"
        echo "otp=${otp_version}" >> "${GITHUB_OUTPUT}"

    - name: Cache Mix dependencies and build
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-${{ runner.arch }}-mix-${{ steps.runtime.outputs.elixir }}-otp-${{ steps.runtime.outputs.otp }}-${{ hashFiles('mix.lock') }}

    - name: Install dependencies
      shell: bash
      run: mix deps.get

    - name: Require static-analysis tools
      if: ${{ inputs.profile != 'test' }}
      shell: bash
      run: |
        set -euo pipefail
        required_tasks=(credo deps.audit dialyzer)
        for task in "${required_tasks[@]}"; do
          mix help "${task}" >/dev/null 2>&1 || {
            echo "✗ Required Mix task '${task}' is unavailable."
            echo "  WHY: full/static CI promises lint, dependency audit, and type analysis without silent skips."
            echo "  HOW: add the compatible development/test dependency that provides '${task}'."
            exit 1
          }
        done
        if mix deps | grep -Eq '^\* phoenix '; then
          mix help sobelow >/dev/null 2>&1 || {
            echo "✗ Phoenix was detected but the Sobelow Mix task is unavailable."
            echo "  HOW: add a compatible Sobelow dependency for dev and test."
            exit 1
          }
        fi

    - name: Check formatting
      if: ${{ inputs.profile != 'test' }}
      shell: bash
      run: mix format --check-formatted

    - name: Compile with warnings as errors
      if: ${{ inputs.profile != 'test' }}
      shell: bash
      run: mix compile --warnings-as-errors

    - name: Run repo-owned strict checks
      if: ${{ inputs.profile != 'test' && inputs.extra-checks-command != '' }}
      shell: bash
      run: ${{ inputs.extra-checks-command }}

    - name: Credo strict
      if: ${{ inputs.profile != 'test' }}
      shell: bash
      run: mix credo --strict

    - name: Reject unused dependencies
      if: ${{ inputs.profile != 'test' }}
      shell: bash
      run: mix deps.unlock --check-unused

    - name: Audit Hex packages
      if: ${{ inputs.profile != 'test' }}
      shell: bash
      run: mix hex.audit

    - name: Audit retired dependencies
      if: ${{ inputs.profile != 'test' }}
      shell: bash
      run: mix deps.audit

    - name: Analyze Phoenix security
      if: ${{ inputs.profile != 'test' }}
      shell: bash
      run: |
        set -euo pipefail
        if mix deps | grep -Eq '^\* phoenix '; then
          mix sobelow --exit
        else
          echo "✓ Phoenix is not a dependency; Sobelow does not apply."
        fi

    - name: Run Dialyzer
      if: ${{ inputs.profile != 'test' }}
      shell: bash
      run: mix dialyzer

    - name: Run pre-test setup
      if: ${{ inputs.profile != 'static' && inputs.pre-test-command != '' }}
      shell: bash
      run: ${{ inputs.pre-test-command }}

    - name: Run tests
      if: ${{ inputs.profile != 'static' }}
      shell: bash
      run: ${{ inputs.test-command }}
