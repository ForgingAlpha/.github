# Composite action: Alpha Apps policy checks.
#
# Enforces the approved repo-local Intent, Requirements, and Architecture
# baseline plus the repository's human-ownership boundary. The action is
# self-contained so public consumer CI does not need a private docs checkout
# token.
#
# Usage:
#
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 10
#       steps:
#         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
#           with:
#             fetch-depth: 0
#         - uses: ForgingAlpha/.github/actions/ci-alphaapps-policy@v1

name: CI Alpha Apps Policy
description: "Alpha Apps policy: approved source truth and human ownership"

inputs:
  base-ref:
    description: "Base branch/ref for changed-file policy checks, or auto"
    required: false
    default: "auto"
  repo-kind:
    description: "Repository kind for auto base-ref selection (auto|code|control-plane)"
    required: false
    default: "auto"

runs:
  using: composite
  steps:
    - name: Validate Alpha Apps policy inputs
      env:
        BASE_REF: ${{ inputs.base-ref }}
        REPO_KIND: ${{ inputs.repo-kind }}
      run: |
        set -euo pipefail

        case "${REPO_KIND}" in
          auto|code|control-plane) ;;
          *)
            echo "✗ Invalid repo-kind input '${REPO_KIND}'."
            echo "  WHAT: repo-kind was '${REPO_KIND}', expected auto, code, or control-plane."
            echo "  WHY: base-ref auto-selection supports only auto, code, or control-plane repositories."
            echo "  HOW: set repo-kind to auto, code, or control-plane."
            exit 1
            ;;
        esac

        if [ -z "${BASE_REF}" ]; then
          echo "✗ Invalid base-ref input: empty string."
          echo "  WHAT: base-ref was empty."
          echo "  WHY: changed-file policy checks need either auto or a concrete base ref."
          echo "  HOW: set base-ref to auto, main, dev, or another available ref."
          exit 1
        fi
      shell: bash

    - name: Validate approved source truth
      env:
        ALPHAAPPS_POLICY_BASE_REF: ${{ inputs.base-ref }}
        ALPHAAPPS_POLICY_REPO_KIND: ${{ inputs.repo-kind }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/validate_product_lifecycle_baseline.py"
      shell: bash

    - name: Validate repository ownership contract
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/validate_codeowners_contract.py"
      shell: bash
