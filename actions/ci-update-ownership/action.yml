name: CI Update Ownership
description: Validate Renovate normal-update ownership and security-only Dependabot configuration.

runs:
  using: composite
  steps:
    - name: Validate update ownership
      shell: bash
      env:
        UPDATE_POLICY_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/validate_update_ownership.py" \
          --repository-root . \
          --default-branch "$UPDATE_POLICY_DEFAULT_BRANCH" \
          --policy .github/update-policy.json \
          --renovate renovate.json \
          --dependabot .github/dependabot.yml
