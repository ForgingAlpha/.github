name: CI Update Ownership
description: Validate Renovate normal-update ownership and security-only Dependabot configuration.

runs:
  using: composite
  steps:
    - name: Validate update ownership
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        FOUNDATION_ACTION_REF: ${{ github.action_ref }}
      run: |
        set -euo pipefail
        python3 -I "$GITHUB_ACTION_PATH/scripts/validate_update_ownership.py" \
          --repository-root . \
          --policy .github/update-policy.json \
          --renovate renovate.json \
          --dependabot .github/dependabot.yml
        python3 -I "$GITHUB_ACTION_PATH/../ci-foundation/scripts/foundation_source.py" \
          update-owner --root "$PWD"
