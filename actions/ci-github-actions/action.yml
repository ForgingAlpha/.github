# Composite action: GitHub Actions safety checks.
#
# Runs actionlint and the shared workflow/composite-action policy checker.
#
# Usage:
#
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 10
#       steps:
#         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
#         - uses: ForgingAlpha/.github/actions/ci-github-actions@v1

name: CI GitHub Actions
description: "GitHub Actions CI: actionlint + shared workflow safety policy"

inputs:
  allowlist-path:
    description: "Optional allowlist YAML for reviewed workflow exceptions"
    required: false
    default: ".github/alphaapps-github-actions-allowlist.yml"

runs:
  using: composite
  steps:
    - name: Install actionlint
      id: get_actionlint
      shell: bash
      env:
        ACTIONLINT_VERSION: "1.7.12"
        ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
      run: bash "$GITHUB_ACTION_PATH/scripts/install_actionlint.sh"
    - name: Run actionlint
      shell: bash
      run: |
        set -euo pipefail
        shopt -s nullglob
        workflow_files=(.github/workflows/*.yml .github/workflows/*.yaml)
        if [ "${#workflow_files[@]}" -eq 0 ]; then
          echo "✓ No GitHub workflow files found for actionlint."
          exit 0
        fi
        "${{ steps.get_actionlint.outputs.executable }}" -color "${workflow_files[@]}"

    - name: Validate GitHub Actions safety policy
      shell: bash
      env:
        ALLOWLIST_PATH: ${{ inputs.allowlist-path }}
      run: |
        set -euo pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/check_workflows.py" --allowlist-path "${ALLOWLIST_PATH}"
