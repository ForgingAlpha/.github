name: Approved Auto-activation
description: Revalidate and merge one exact human-approved revision through the protected release App.

inputs:
  authorized-approver:
    description: GitHub login whose current exact-head approval authorizes activation.
    required: false
    default: leosmigel
  persistent-branches:
    description: Comma-separated persistent branches eligible for activation.
    required: true
  merge-method:
    description: GitHub pull-request merge method.
    required: false
    default: merge
  approval-head-sha:
    description: Head SHA from the completed read-only approval signal.
    required: true
  release-app-client-id:
    description: Client ID for the protected release GitHub App.
    required: true
  release-app-private-key:
    description: Environment-protected private key for the release GitHub App.
    required: true

runs:
  using: composite
  steps:
    - name: Resolve unique open pull request
      id: resolver
      shell: bash
      env:
        APPROVAL_HEAD_SHA: ${{ inputs.approval-head-sha }}
        APPROVAL_PULL_REQUESTS: ${{ toJSON(github.event.workflow_run.pull_requests) }}
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail

        fail() {
          echo "✗ $1" >&2
          echo "  WHY: $2" >&2
          echo "  HOW: $3" >&2
          exit 1
        }

        [[ "${APPROVAL_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] \
          || fail "Invalid approval-signal head" "GitHub event data must identify one full commit SHA" "inspect the approval-signal run"

        raw_pull_requests="${APPROVAL_PULL_REQUESTS:-}"
        if [ -z "${raw_pull_requests//[[:space:]]/}" ]; then
          event_pull_requests='[]'
        else
          event_pull_requests="$(jq -ce \
            'if . == null then [] elif type == "array" then . else error("not an array") end' \
            <<<"${raw_pull_requests}")" \
            || fail "Malformed approval-signal pull-request pointers" "GitHub workflow-run event data must be an array" "inspect the approval-signal run"
        fi

        event_candidate_count="$(jq -r 'length' <<<"${event_pull_requests}")"
        [ "${event_candidate_count}" -le 1 ] \
          || fail "Approval signal identifies multiple pull requests" "GitHub workflow-run event data contains ${event_candidate_count} pull-request pointers" "submit a fresh approval on one unambiguous revision"

        if [ "${event_candidate_count}" = "1" ]; then
          jq -e '.[0].number | type == "number" and . > 0 and floor == .' \
            <<<"${event_pull_requests}" >/dev/null \
            || fail "Approval-signal pull-request number is invalid" "GitHub workflow-run event data must identify one positive integer" "inspect the approval-signal run"
          pr_number="$(jq -r '.[0].number' <<<"${event_pull_requests}")"
          live_pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${pr_number}")"
          jq -e \
            --argjson number "${pr_number}" \
            --arg head "${APPROVAL_HEAD_SHA}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            '.number == $number and
             .state == "open" and
             .head.sha == $head and
             .head.repo.full_name == $repo' \
            <<<"${live_pr}" >/dev/null \
            || fail "Approval-signal pull-request pointer is stale or invalid" "the live pull request must be open, same-repository, and at ${APPROVAL_HEAD_SHA}" "submit a fresh approval on the current revision"
        else
          associated="$(gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/commits/${APPROVAL_HEAD_SHA}/pulls?per_page=100")"
          candidates="$(jq -c \
            --arg head "${APPROVAL_HEAD_SHA}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            '[.[][] | select(
              .state == "open" and
              .head.sha == $head and
              .head.repo.full_name == $repo
            )]' \
            <<<"${associated}")"
          candidate_count="$(jq -r 'length' <<<"${candidates}")"
          [ "${candidate_count}" = "1" ] \
            || fail "Approval signal does not identify one open pull request" "found ${candidate_count} same-repository open pull requests at ${APPROVAL_HEAD_SHA}" "close duplicate proposals or submit a fresh approval on one current revision"
          pr_number="$(jq -r '.[0].number' <<<"${candidates}")"
        fi

        [[ "${pr_number}" =~ ^[1-9][0-9]*$ ]] \
          || fail "Resolved pull-request number is invalid" "GitHub event and association data must remain passive input" "inspect the approval-signal run"
        echo "pull_request_number=${pr_number}" >> "${GITHUB_OUTPUT}"

    - name: Mint protected release token
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        client-id: ${{ inputs.release-app-client-id }}
        private-key: ${{ inputs.release-app-private-key }}
        permission-contents: write
        permission-pull-requests: write

    - name: Revalidate exact approval and activate
      shell: bash
      env:
        AUTHORIZED_APPROVER: ${{ inputs.authorized-approver }}
        GH_TOKEN: ${{ steps.app-token.outputs.token }}
        MERGE_METHOD: ${{ inputs.merge-method }}
        PERSISTENT_BRANCHES: ${{ inputs.persistent-branches }}
        PR_NUMBER: ${{ steps.resolver.outputs.pull_request_number }}
        APPROVAL_HEAD_SHA: ${{ inputs.approval-head-sha }}
      run: |
        set -euo pipefail

        fail() {
          echo "✗ $1" >&2
          echo "  WHY: $2" >&2
          echo "  HOW: $3" >&2
          exit 1
        }

        [[ "${AUTHORIZED_APPROVER}" =~ ^[A-Za-z0-9][A-Za-z0-9-]*$ ]] \
          || fail "Invalid authorized approver" "identity matching must be exact" "pass one GitHub login"
        [[ "${APPROVAL_HEAD_SHA}" =~ ^[0-9a-f]{40}$ ]] \
          || fail "Invalid approval-signal head" "activation must bind to GitHub's completed approval run" "inspect the approval-signal run"
        [[ "${PR_NUMBER}" =~ ^[1-9][0-9]*$ ]] \
          || fail "Invalid pull-request number" "resolved association data must be treated as passive input" "inspect the approval-signal run"
        case "${MERGE_METHOD}" in
          merge|squash|rebase) ;;
          *) fail "Unsupported merge method '${MERGE_METHOD}'" "activation must use a declared GitHub merge method" "use merge, squash, or rebase" ;;
        esac

        pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
        state="$(jq -r '.state' <<<"${pr}")"
        draft="$(jq -r '.draft' <<<"${pr}")"
        head_sha="$(jq -r '.head.sha' <<<"${pr}")"
        head_repo="$(jq -r '.head.repo.full_name // ""' <<<"${pr}")"
        base_branch="$(jq -r '.base.ref' <<<"${pr}")"

        [ "${state}" = "open" ] \
          || fail "Pull request is not open" "closed proposals cannot authorize a branch change" "open a current pull request"
        [ "${draft}" = "false" ] \
          || fail "Pull request is a draft" "draft review is not activation authority" "mark it ready and submit a fresh approval"
        [ "${head_repo}" = "${GITHUB_REPOSITORY}" ] \
          || fail "Pull request head is outside the protected repository" "fork content cannot receive activation authority" "use an authorized same-repository task branch"
        [[ "${head_sha}" =~ ^[0-9a-f]{40}$ ]] \
          || fail "Pull-request head is not a full SHA" "activation must bind to one immutable revision" "inspect the pull request"
        [ "${head_sha}" = "${APPROVAL_HEAD_SHA}" ] \
          || fail "Pull-request head no longer matches the approval signal" "activation was signaled for ${APPROVAL_HEAD_SHA}, not ${head_sha}" "submit a fresh approval on the current revision"

        branch_allowed=false
        IFS=',' read -r -a branches <<<"${PERSISTENT_BRANCHES}"
        for raw_branch in "${branches[@]}"; do
          branch="${raw_branch//[[:space:]]/}"
          [[ "${branch}" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]*$ ]] \
            || fail "Invalid persistent branch '${branch}'" "branch authority must be explicit" "pass comma-separated GitHub branch names"
          if [ "${base_branch}" = "${branch}" ]; then
            branch_allowed=true
          fi
        done
        [ "${branch_allowed}" = "true" ] \
          || fail "Target branch '${base_branch}' is not eligible" "automation may change only declared persistent branches" "use the repository's governed promotion flow"

        reviews="$(gh api --paginate --slurp \
          "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/reviews?per_page=100")"
        latest_authority="$(jq -c \
          --arg approver "${AUTHORIZED_APPROVER}" \
          '[.[][] | select(.user.login == $approver and .state != "COMMENTED")]
           | if length == 0 then null else max_by(.id) end' \
          <<<"${reviews}")"
        jq -e \
          --arg head "${head_sha}" \
          '.state == "APPROVED" and .commit_id == $head' \
          <<<"${latest_authority}" >/dev/null \
          || fail "Current exact-head human approval is absent" "only ${AUTHORIZED_APPROVER}'s latest authoritative review may activate ${head_sha}" "submit a fresh approval on the current revision"

        current_head="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" --json headRefOid --jq '.headRefOid')"
        [ "${current_head}" = "${head_sha}" ] \
          || fail "Pull-request head changed during revalidation" "activation is bound to ${head_sha}" "approve the current revision"

        merge_payload="$(jq -cn \
          --arg sha "${head_sha}" \
          --arg merge_method "${MERGE_METHOD}" \
          '{sha: $sha, merge_method: $merge_method}')"
        merge_result="$(gh api --method PUT \
          "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/merge" \
          --input - <<<"${merge_payload}")"
        jq -e '.merged == true' <<<"${merge_result}" >/dev/null \
          || fail "GitHub did not merge the approved pull request" "the synchronous merge endpoint returned a non-merge result" "inspect repository rulesets and the release App authority"

        result="$(gh pr view "${PR_NUMBER}" --repo "${GITHUB_REPOSITORY}" \
          --json state,headRefOid)"
        jq -e --arg head "${head_sha}" \
          '.state == "MERGED" and .headRefOid == $head' \
          <<<"${result}" >/dev/null \
          || fail "GitHub did not complete exact-head activation" "the protected merge did not record the approved head" "inspect repository rulesets and the release App authority"

        {
          echo "## Exact approval activated"
          echo
          echo "- pull request: \`#${PR_NUMBER}\`"
          echo "- approved head: \`${head_sha}\`"
          echo "- target branch: \`${base_branch}\`"
          echo "- authorized approver: \`${AUTHORIZED_APPROVER}\`"
          echo "- result: \`$(jq -r '.state' <<<"${result}")\`"
        } >> "${GITHUB_STEP_SUMMARY}"
