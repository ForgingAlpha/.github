name: Exact Security Patch Projection
description: Deterministically create or adopt one verified Dependabot patch on current production.

inputs:
  github-token:
    description: No-bypass automation App token with repository write, pull-request write, checks write, and vulnerability-alert read.
    required: true
  source-merge-sha:
    description: Exact merged dev security revision emitted by trusted push CI.
    required: true
  source-branch:
    description: Protected integration branch.
    required: false
    default: dev
  target-branch:
    description: Protected production branch.
    required: false
    default: main
  manifest-path:
    description: Optional legacy-root assertion; omit for canonical dependency-set discovery.
    required: false
  lock-path:
    description: Optional legacy-root assertion; omit for canonical dependency-set discovery.
    required: false
outputs:
  eligible:
    description: True only after the exact projection pull request and attestation exist.
    value: ${{ steps.project.outputs.eligible }}
  pull-request-number:
    description: Created production projection pull request.
    value: ${{ steps.project.outputs.pull_request_number }}
  projection-head-sha:
    description: Exact projected production head.
    value: ${{ steps.project.outputs.projection_head_sha }}
  production-base-sha:
    description: Exact production base used by the projection.
    value: ${{ steps.project.outputs.production_base_sha }}

runs:
  using: composite
  steps:
    - name: Re-prove source and create or adopt exact production projection
      id: project
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        SECURITY_SOURCE_MERGE_SHA: ${{ inputs.source-merge-sha }}
        SECURITY_SOURCE_BRANCH: ${{ inputs.source-branch }}
        SECURITY_TARGET_BRANCH: ${{ inputs.target-branch }}
        SECURITY_MANIFEST_PATH: ${{ inputs.manifest-path }}
        SECURITY_LOCK_PATH: ${{ inputs.lock-path }}
      run: |
        set -euo pipefail
        path_args=()
        if [[ -n "${SECURITY_MANIFEST_PATH}" ]]; then path_args+=(--manifest-path "${SECURITY_MANIFEST_PATH}"); fi
        if [[ -n "${SECURITY_LOCK_PATH}" ]]; then path_args+=(--lock-path "${SECURITY_LOCK_PATH}"); fi
        python3 "${GITHUB_ACTION_PATH}/../security-patch/scripts/security_patch.py" project \
          --repository "${GITHUB_REPOSITORY}" \
          --source-merge-sha "${SECURITY_SOURCE_MERGE_SHA}" \
          --source-branch "${SECURITY_SOURCE_BRANCH}" \
          --target-branch "${SECURITY_TARGET_BRANCH}" \
          "${path_args[@]}"
