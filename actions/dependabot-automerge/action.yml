name: Dependabot Auto-merge
description: Enable auto-merge for allowed Dependabot semantic-version updates.
inputs:
  github_token:
    description: Token with permission to read Dependabot metadata and enable PR auto-merge.
    required: true
  allow_patch:
    description: Enable auto-merge for Dependabot semver patch updates.
    required: false
    default: "true"
  allow_minor:
    description: Enable auto-merge for Dependabot semver minor updates.
    required: false
    default: "true"
  allow_major:
    description: Enable auto-merge for Dependabot semver major updates.
    required: false
    default: "false"
  merge_method:
    description: Pull request merge method.
    required: false
    default: squash
runs:
  using: composite
  steps:
    - name: Fetch Dependabot metadata
      id: metadata
      uses: dependabot/fetch-metadata@v3
      with:
        github-token: ${{ inputs.github_token }}

    - name: Decide auto-merge eligibility
      id: eligibility
      shell: bash
      env:
        UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
        ALLOW_PATCH: ${{ inputs.allow_patch }}
        ALLOW_MINOR: ${{ inputs.allow_minor }}
        ALLOW_MAJOR: ${{ inputs.allow_major }}
      run: |
        set -euo pipefail

        allowed=false
        case "${UPDATE_TYPE}" in
          version-update:semver-patch)
            allowed="${ALLOW_PATCH}"
            ;;
          version-update:semver-minor)
            allowed="${ALLOW_MINOR}"
            ;;
          version-update:semver-major)
            allowed="${ALLOW_MAJOR}"
            ;;
          *)
            allowed=false
            ;;
        esac

        echo "update_type=${UPDATE_TYPE}"
        echo "allowed=${allowed}"
        echo "allowed=${allowed}" >> "${GITHUB_OUTPUT}"

    - name: Validate merge method
      if: ${{ steps.eligibility.outputs.allowed == 'true' }}
      shell: bash
      env:
        MERGE_METHOD: ${{ inputs.merge_method }}
      run: |
        set -euo pipefail

        case "${MERGE_METHOD}" in
          merge|squash|rebase)
            ;;
          *)
            echo "Unsupported merge_method '${MERGE_METHOD}'. Use merge, squash, or rebase." >&2
            exit 1
            ;;
        esac

    - name: Enable auto-merge
      if: ${{ steps.eligibility.outputs.allowed == 'true' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        MERGE_METHOD: ${{ inputs.merge_method }}
        PR_URL: ${{ github.event.pull_request.html_url }}
      run: |
        set -euo pipefail
        gh pr merge --auto "--${MERGE_METHOD}" "${PR_URL}"
