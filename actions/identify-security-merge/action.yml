name: Identify Security Merge
description: Re-prove that an exact merged Dependabot revision fixes an official GitHub security alert.
inputs:
  github_token:
    description: GitHub App token with pull-request and vulnerability-alert read permission.
    required: true
  sha:
    description: Exact merged revision to classify.
    required: true
  base_branch:
    description: Protected integration branch whose current head must equal sha.
    required: false
    default: dev
  label:
    description: Label applied by the trusted Dependabot classification workflow.
    required: false
    default: security-autopromote
  automation_app_id:
    description: GitHub App ID that must own the exact-head security classification check and merge.
    required: true
outputs:
  eligible:
    description: true only when the exact merge is associated with an official open or fixed alert.
    value: ${{ steps.identify.outputs.eligible }}
  sha:
    description: Exact eligible revision.
    value: ${{ steps.identify.outputs.sha }}
  pull_request_number:
    description: Associated Dependabot pull request number.
    value: ${{ steps.identify.outputs.pull_request_number }}
  ghsa_set:
    description: Comma-separated associated GHSA identifiers.
    value: ${{ steps.identify.outputs.ghsa_set }}
runs:
  using: composite
  steps:
    - name: Re-prove exact security merge
      id: identify
      shell: bash
      env:
        BASE_BRANCH: ${{ inputs.base_branch }}
        AUTOMATION_APP_ID: ${{ inputs.automation_app_id }}
        GH_TOKEN: ${{ inputs.github_token }}
        REQUIRED_LABEL: ${{ inputs.label }}
        SHA: ${{ inputs.sha }}
      run: |
        set -euo pipefail
        echo "eligible=false" >> "${GITHUB_OUTPUT}"

        [[ "${SHA}" =~ ^[0-9a-f]{40}$ ]] || {
          echo "✗ Security promotion requires a full commit SHA." >&2
          exit 1
        }
        [[ "${AUTOMATION_APP_ID}" =~ ^[1-9][0-9]*$ ]] || {
          echo "✗ automation_app_id must be a positive integer." >&2
          exit 1
        }
        current_base="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BASE_BRANCH}" --jq '.object.sha')"
        [ "${current_base}" = "${SHA}" ] || {
          echo "Base branch moved; stale security revision will not be promoted."
          exit 0
        }

        gh api --paginate --slurp \
          -H 'Accept: application/vnd.github+json' \
          "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls?per_page=100" \
          > /tmp/security-merge-pulls.json
        matches="$(jq -c --arg base "${BASE_BRANCH}" --arg label "${REQUIRED_LABEL}" --arg sha "${SHA}" \
          '[.[][] | select(
            .merged_at != null and
            .merge_commit_sha == $sha and
            .base.ref == $base and
            .user.login == "dependabot[bot]" and
            any(.labels[]?; .name == $label)
          )]' /tmp/security-merge-pulls.json)"
        match_count="$(jq 'length' <<<"${matches}")"
        if [ "${match_count}" = "0" ]; then
          exit 0
        fi
        [ "${match_count}" = "1" ] || {
          echo "✗ Exact revision matched more than one labeled Dependabot merge." >&2
          exit 1
        }
        pr_number="$(jq -r '.[0].number' <<<"${matches}")"
        pr_head_sha="$(jq -r '.[0].head.sha' <<<"${matches}")"
        merged_by_login="$(jq -r '.[0].merged_by.login // empty' <<<"${matches}")"
        [[ "${pr_head_sha}" =~ ^[0-9a-f]{40}$ ]] || {
          echo "✗ Merged Dependabot PR has no immutable head SHA." >&2
          exit 1
        }

        gh api --paginate --slurp \
          "repos/${GITHUB_REPOSITORY}/commits/${pr_head_sha}/check-runs?per_page=100" \
          > /tmp/security-classification-checks.json
        external_id="security-pr-${pr_number}-${pr_head_sha}"
        classifications="$(jq -c \
          --arg name "AlphaApps Security Classification" \
          --arg external_id "${external_id}" \
          --arg head "${pr_head_sha}" \
          --argjson app_id "${AUTOMATION_APP_ID}" \
          '[.[].check_runs[] | select(
            .name == $name and
            .external_id == $external_id and
            .head_sha == $head and
            .status == "completed" and
            .conclusion == "success" and
            .app.id == $app_id
          )]' /tmp/security-classification-checks.json)"
        [ "$(jq 'length' <<<"${classifications}")" -gt 0 ] || {
          echo "✗ Exact PR head lacks a trusted security-classification check." >&2
          exit 1
        }
        app_slug="$(jq -r '.[0].app.slug' <<<"${classifications}")"
        [ -n "${app_slug}" ] && [ "${merged_by_login}" = "${app_slug}[bot]" ] || {
          echo "✗ Security merge was not completed by the classification App." >&2
          exit 1
        }

        query='query($owner:String!,$name:String!,$endCursor:String){repository(owner:$owner,name:$name){vulnerabilityAlerts(first:100,after:$endCursor,states:[OPEN,FIXED,DISMISSED,AUTO_DISMISSED]){nodes{state securityAdvisory{ghsaId}dependabotUpdate{pullRequest{number}}}pageInfo{hasNextPage endCursor}}}}'
        owner="${GITHUB_REPOSITORY%%/*}"
        name="${GITHUB_REPOSITORY#*/}"
        alerts="$(gh api graphql --paginate --slurp \
          -f query="${query}" -f owner="${owner}" -f name="${name}")"
        associated="$(jq -c --argjson pr "${pr_number}" \
          '[.[].data.repository.vulnerabilityAlerts.nodes[]
            | select(.dependabotUpdate.pullRequest.number == $pr)
            | select(.state == "OPEN" or .state == "FIXED")
            | .securityAdvisory.ghsaId]
           | map(select(. != null and . != "")) | unique' <<<"${alerts}")"
        [ "$(jq 'length' <<<"${associated}")" -gt 0 ] || {
          echo "✗ Labeled merge has no official open or fixed GitHub security-alert association." >&2
          exit 1
        }

        ghsa_set="$(jq -r 'join(",")' <<<"${associated}")"
        echo "eligible=true" >> "${GITHUB_OUTPUT}"
        echo "ghsa_set=${ghsa_set}" >> "${GITHUB_OUTPUT}"
        echo "pull_request_number=${pr_number}" >> "${GITHUB_OUTPUT}"
        echo "sha=${SHA}" >> "${GITHUB_OUTPUT}"
