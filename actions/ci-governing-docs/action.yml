name: CI Governing Documents
description: Check the governing documents and Markdown in a private development PR.

inputs:
  scopes:
    description: Comma-separated governing directories including the repository root.
    required: true

runs:
  using: composite
  steps:
    - name: Set up the Markdown tool runtime
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'
    - name: Verify caller, governing documents and human review protection
      shell: bash
      env:
        GOV_ACTION_REPOSITORY: ${{ github.action_repository }}
        GOV_ACTION_REF: ${{ github.action_ref }}
        GOV_SCOPES: ${{ inputs.scopes }}
        GITHUB_TOKEN: ${{ github.token }}
      run: python3 -I -B "$GITHUB_ACTION_PATH/check.py"
