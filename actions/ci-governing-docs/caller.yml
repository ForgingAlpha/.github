name: CI
on:
  pull_request:
    branches: [dev]

permissions:
  contents: read
  pull-requests: read

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ForgingAlpha/.github/actions/ci-governing-docs@main
        with:
          scopes: '.'
