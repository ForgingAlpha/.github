name: Exact Security Patch Classification
description: Preflight or classify one exact Dependabot security patch for human review and merge.

inputs:
  github-token:
    description: Read-only Actions/checks/contents/PR token for preflight; classification adds official alert read and checks write through the fixed App.
    required: true
  workflow-run-id:
    description: Exact successful CI workflow run that woke the protected resolver.
    required: true
  operation:
    description: Either preflight or classify; preflight does not read official alert associations.
    required: false
    default: preflight
  expected-pull-request:
    description: Pull request number emitted by the preceding read-only preflight.
    required: false
  expected-head-sha:
    description: Exact source head emitted by the preceding read-only preflight.
    required: false
  expected-base-sha:
    description: Exact protected dev base emitted by the preceding read-only preflight.
    required: false

outputs:
  verified:
    description: True when structural preflight and trusted checks succeed; official alert eligibility is proved by classification.
    value: ${{ steps.preflight.outputs.verified }}
  pull-request-number:
    description: Exact Dependabot source pull request.
    value: ${{ steps.preflight.outputs.pull_request_number || steps.classify.outputs.pull_request_number }}
  source-base-sha:
    description: Exact protected dev base proved by preflight.
    value: ${{ steps.preflight.outputs.source_base_sha || steps.classify.outputs.source_base_sha }}
  source-head-sha:
    description: Exact Dependabot source head proved by preflight.
    value: ${{ steps.preflight.outputs.source_head_sha || steps.classify.outputs.source_head_sha }}
  classified:
    description: True when the exact official alert association and trusted checks are classified.
    value: ${{ steps.classify.outputs.classified }}

runs:
  using: composite
  steps:
    - name: Validate operation
      shell: bash
      env:
        OPERATION: ${{ inputs.operation }}
        EXPECTED_PR: ${{ inputs.expected-pull-request }}
        EXPECTED_HEAD: ${{ inputs.expected-head-sha }}
        EXPECTED_BASE: ${{ inputs.expected-base-sha }}
      run: |
        set -euo pipefail
        case "${OPERATION}" in
          preflight) ;;
          classify)
            [[ "${EXPECTED_PR}" =~ ^[1-9][0-9]*$ ]] || {
              echo "✗ classify requires the exact preflight pull-request number." >&2
              exit 1
            }
            [[ "${EXPECTED_HEAD}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "✗ classify requires the exact preflight source head." >&2
              exit 1
            }
            [[ "${EXPECTED_BASE}" =~ ^[0-9a-f]{40}$ ]] || {
              echo "✗ classify requires the exact preflight source base." >&2
              exit 1
            }
            ;;
          *)
            echo "✗ operation must be preflight or classify." >&2
            exit 1
            ;;
        esac

    - name: Prove exact source without merge authority
      id: preflight
      if: ${{ inputs.operation == 'preflight' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/../security-patch/scripts/security_patch.py" preflight-source \
          --repository "${GITHUB_REPOSITORY}" \
          --workflow-run-id "${{ inputs.workflow-run-id }}" \
          --wait-seconds 300

    - name: Re-prove and classify exact source
      id: classify
      if: ${{ inputs.operation == 'classify' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        set -euo pipefail
        python3 "${GITHUB_ACTION_PATH}/../security-patch/scripts/security_patch.py" classify-source \
          --repository "${GITHUB_REPOSITORY}" \
          --workflow-run-id "${{ inputs.workflow-run-id }}" \
          --pull-request "${{ inputs.expected-pull-request }}" \
          --expected-head-sha "${{ inputs.expected-head-sha }}" \
          --expected-base-sha "${{ inputs.expected-base-sha }}"
