# Composite action: Astro static site CI checks.
#
# Runs the standard Astro static-site CI gate: prettier, eslint, astro check,
# and npm build.
#
# Usage:
#
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 20
#       steps:
#         - uses: actions/checkout@v7
#         - uses: ForgingAlpha/.github/actions/ci-astro@v1

name: CI Astro
description: "Astro CI: prettier, eslint, astro check, build"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  working-directory:
    description: "Subdirectory containing package.json"
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Enforce merge flow
      uses: ForgingAlpha/.github/actions/ci-merge-flow@v1

    - name: Setup Node.js (${{ inputs.node-version }})
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Check formatting (Prettier)
      run: npx prettier --check .
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Lint (ESLint)
      run: npx eslint --max-warnings 0 .
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Type check (Astro)
      run: npx astro check
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Build check
      run: npm run build
      shell: bash
      working-directory: ${{ inputs.working-directory }}
