# Read-only CI admission. Owner projection selects ordinary targets; the existing
# security verifier supplies distinct structural-source/projection proof.
# CI admission grants neither classification, proposal authority nor merge rights.
# Required caller metadata scopes: contents: read, pull-requests: read, checks: read.
name: CI Merge Flow
description: Enforce exact owner-bound proposal admission
runs:
  using: composite
  steps:
    - name: Enforce merge flow policy
      if: ${{ github.event_name == 'pull_request' }}
      env:
        GH_TOKEN: ${{ github.token }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/check_merge_flow.sh" admit
