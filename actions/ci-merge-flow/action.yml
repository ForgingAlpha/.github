# Composite action: Enforce merge flow policy.
#
# ForgingAlpha/.github retains its adopted task-to-main enabling route, bound
# to exact runtime and PR base identity regardless of whether dev exists. Task
# heads may come from this repository or a fork; main/dev/staging heads refuse.
# This admits required CI only, not semantic release acceptance or a merge.
#
# Other legacy consumers fail `CI` when a PR targets `main` or `staging` with
# a source other than the same-repository `dev` branch, except for a machine-attested exact
# security projection admitted only to run required CI. Enforces:
#
#     feature → dev → {staging, main}
#
# On that legacy route, hotfix and release branches must PR into
# `dev`, not directly into `main`/`staging`. Closes a gap in GitHub Rulesets,
# which have no native rule to restrict a PR's source branch.
#
# That legacy route exempts repos that have no `dev` branch (main-only repos are
# not subject to the gitflow merge policy). Detection uses the GitHub API,
# so the guard runs correctly before `actions/checkout`.
#
# Wired as the first step inside each language composite (ci-astro,
# ci-elixir, ci-rust, ci-shell, ci-typescript) so enforcement rides on the
# existing `CI` required status check — no per-repo workflow changes needed.
# A failure here fails the entire `CI` job, which the `release-branches`
# org ruleset already blocks on.
#
# SECURITY: This action must be invoked from workflows triggered by the
# `pull_request` event, NOT `pull_request_target`. The `pull_request_target`
# trigger grants write permissions and secrets to workflows executed from
# fork PRs, enabling the "pwn request" attack vector documented by the
# GitHub Security Lab. All consuming `ci-*` composites already use
# `pull_request` via their callers' `ci.yml`.

# Caller GITHUB_TOKEN permissions: contents: read, checks: read, pull-requests: read.
# These read scopes support exact projection admission and grant no merge authority.
name: CI Merge Flow
description: "Enforce governed admission into main and staging"

runs:
  using: composite
  steps:
    - name: Enforce merge flow policy
      if: >-
        ${{ github.event_name == 'pull_request' &&
            (github.event.pull_request.base.ref == 'main' ||
             github.event.pull_request.base.ref == 'staging' ||
             github.repository == 'ForgingAlpha/.github' ||
             github.repository_id == '1137664016' ||
             github.event.pull_request.base.repo.full_name == 'ForgingAlpha/.github' ||
             github.event.pull_request.base.repo.id == 1137664016) }}
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
        BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/check_merge_flow.sh" legacy-observed
