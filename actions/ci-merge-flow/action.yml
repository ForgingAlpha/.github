# Read-only pull_request admission. A route check never grants merge authority.
name: CI Merge Flow
description: "Enforce governed admission into main and staging"

runs:
  using: composite
  steps:
    - name: Enforce merge flow policy
      if: ${{ github.event_name == 'pull_request' }}
      env:
        GH_TOKEN: ${{ github.token }}
        HEAD_REF: ${{ github.event.pull_request.head.ref }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
        BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        BASE_REPOSITORY_ID: ${{ github.event.pull_request.base.repo.id }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REF: ${{ github.event.pull_request.base.ref }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
      shell: bash
      run: python3 -I "$GITHUB_ACTION_PATH/scripts/check_merge_flow.py"
