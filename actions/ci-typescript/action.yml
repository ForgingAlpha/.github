# Composite action: TypeScript CI checks (non-Astro).
#
# Runs the standard TypeScript CI gate for non-Astro repos. Supports repos
# where TypeScript lives at the root or in a subdirectory.
#
# Usage:
#
#   # TypeScript plugin in plugin/ subdirectory:
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 20
#       steps:
#         - uses: actions/checkout@v7
#         - uses: ForgingAlpha/.github/actions/ci-typescript@v1
#           with:
#             working-directory: plugin
#
#   # TypeScript at repo root:
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 20
#       steps:
#         - uses: actions/checkout@v7
#         - uses: ForgingAlpha/.github/actions/ci-typescript@v1

name: CI TypeScript
description: "TypeScript CI: prettier, eslint, tsc, tests"

inputs:
  node-version:
    description: "Node.js version"
    required: false
    default: "24"
  working-directory:
    description: "Subdirectory containing package.json"
    required: false
    default: "."
runs:
  using: composite
  steps:
    - name: Enforce merge flow
      uses: ForgingAlpha/.github/actions/ci-merge-flow@v1

    - name: Setup Node.js (${{ inputs.node-version }})
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: ${{ inputs.node-version }}
        cache: "npm"
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Install dependencies
      run: npm ci
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Check formatting (Prettier)
      run: npx prettier --check .
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Lint (ESLint)
      run: npx eslint --max-warnings 0 .
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Type check (tsc)
      run: npx tsc --noEmit
      shell: bash
      working-directory: ${{ inputs.working-directory }}

    - name: Run tests
      run: npm test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
