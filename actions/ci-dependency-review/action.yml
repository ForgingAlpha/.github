# Composite action: Dependency review.
#
# Runs GitHub's dependency-review action on pull requests. Rust repos keep
# cargo audit in addition to this PR dependency diff review.
#
# Usage:
#
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 10
#       steps:
#         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
#         - uses: ForgingAlpha/.github/actions/ci-dependency-review@v1

name: CI Dependency Review
description: "Mandatory PR vulnerability and commercial-license review"

runs:
  using: composite
  steps:
    - name: Skip dependency review outside pull_request
      if: ${{ github.event_name != 'pull_request' }}
      shell: bash
      run: |
        echo "✓ Dependency review is not applicable outside pull_request."
        echo "  WHAT: event was '${{ github.event_name }}'."
        echo "  WHY: dependency review compares dependency changes introduced by pull requests."
        echo "  HOW: run this action from a pull_request workflow to enforce dependency review."

    - name: Dependency Review
      id: review
      if: ${{ github.event_name == 'pull_request' }}
      uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
      with:
        fail-on-severity: low
        fail-on-scopes: runtime,development,unknown
        allow-licenses: 0BSD,Apache-2.0,BSD-2-Clause,BSD-3-Clause,BlueOak-1.0.0,BSL-1.0,CC0-1.0,ISC,MIT,MIT-0,PostgreSQL,Python-2.0,Unicode-3.0,Unicode-DFS-2016,Unlicense,Zlib

    - name: Reject missing license evidence
      if: ${{ github.event_name == 'pull_request' && always() }}
      shell: bash
      env:
        DEPENDENCY_CHANGES: ${{ steps.review.outputs.dependency-changes }}
      run: python3 "$GITHUB_ACTION_PATH/scripts/validate_license_evidence.py"
