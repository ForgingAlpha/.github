# Composite action: Dependency review.
#
# Runs GitHub's dependency-review action on pull requests. Rust repos keep
# cargo audit in addition to this PR dependency diff review.
#
# Usage:
#
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 10
#       steps:
#         - uses: actions/checkout@v7
#         - uses: ForgingAlpha/.github/actions/ci-dependency-review@v1

name: CI Dependency Review
description: "Dependency review: PR dependency vulnerability and license checks"

inputs:
  enabled:
    description: "Run dependency review (true|false)"
    required: false
    default: "true"
  fail-on-severity:
    description: "Minimum vulnerability severity that fails the action"
    required: false
    default: "low"
  fail-on-scopes:
    description: "Comma-separated scopes that fail dependency review"
    required: false
    default: "runtime,development,unknown"
  allow-licenses:
    description: "Optional SPDX license allowlist"
    required: false
    default: ""
  deny-licenses:
    description: "Optional deprecated SPDX license denylist; prefer allow-licenses"
    required: false
    default: ""
  allow-dependencies-licenses:
    description: "Optional package-url list excluded from license checks"
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Validate dependency review inputs
      shell: bash
      env:
        ENABLED: ${{ inputs.enabled }}
        FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        FAIL_ON_SCOPES: ${{ inputs.fail-on-scopes }}
        ALLOW_LICENSES: ${{ inputs.allow-licenses }}
        DENY_LICENSES: ${{ inputs.deny-licenses }}
      run: |
        set -euo pipefail

        case "${ENABLED}" in
          true|false) ;;
          *)
            echo "✗ Invalid enabled input '${ENABLED}'."
            echo "  WHAT: enabled was '${ENABLED}', expected true or false."
            echo "  WHY: ci-dependency-review supports only an explicit enabled boolean."
            echo "  HOW: set enabled to true or false."
            exit 1
            ;;
        esac

        case "${FAIL_ON_SEVERITY}" in
          low|moderate|high|critical) ;;
          *)
            echo "✗ Invalid fail-on-severity input '${FAIL_ON_SEVERITY}'."
            echo "  WHAT: fail-on-severity was '${FAIL_ON_SEVERITY}'."
            echo "  WHY: GitHub dependency-review supports low, moderate, high, or critical."
            echo "  HOW: set fail-on-severity to one of: low, moderate, high, critical."
            exit 1
            ;;
        esac

        IFS=',' read -ra scopes <<< "${FAIL_ON_SCOPES}"
        for raw_scope in "${scopes[@]}"; do
          scope="$(echo "${raw_scope}" | xargs)"
          [ -n "${scope}" ] || continue
          case "${scope}" in
            runtime|development|unknown) ;;
            *)
              echo "✗ Invalid fail-on-scopes entry '${scope}'."
              echo "  WHAT: fail-on-scopes included '${scope}'."
              echo "  WHY: GitHub dependency-review supports runtime, development, and unknown scopes."
              echo "  HOW: set fail-on-scopes to a comma-separated subset of runtime,development,unknown."
              exit 1
              ;;
          esac
        done

        if [ -n "${ALLOW_LICENSES}" ] && [ -n "${DENY_LICENSES}" ]; then
          echo "✗ Both allow-licenses and deny-licenses were set."
          echo "  WHAT: license policy used both allow and deny lists."
          echo "  WHY: GitHub dependency-review supports only one license policy direction at a time."
          echo "  HOW: prefer allow-licenses, or remove allow-licenses before using the deprecated deny-licenses input."
          exit 1
        fi

        if [ -n "${DENY_LICENSES}" ]; then
          echo "⚠ deny-licenses is deprecated by actions/dependency-review-action."
          echo "  WHAT: deny-licenses was set for this repo."
          echo "  WHY: the upstream action marks deny-licenses deprecated for possible removal."
          echo "  HOW: document the repo-specific reason or migrate to allow-licenses."
        fi

    - name: Skip dependency review when disabled
      if: ${{ inputs.enabled == 'false' }}
      shell: bash
      run: |
        echo "✓ Dependency review disabled by input."
        echo "  WHAT: ci-dependency-review enabled=false."
        echo "  WHY: this shared action was explicitly disabled by the caller."
        echo "  HOW: set enabled=true to enforce dependency review on pull requests."

    - name: Skip dependency review outside pull_request
      if: ${{ inputs.enabled == 'true' && github.event_name != 'pull_request' }}
      shell: bash
      run: |
        echo "✓ Dependency review skipped outside pull_request."
        echo "  WHAT: event was '${{ github.event_name }}'."
        echo "  WHY: dependency review compares dependency changes introduced by pull requests."
        echo "  HOW: run this action from a pull_request workflow to enforce dependency review."

    - name: Dependency Review
      if: ${{ inputs.enabled == 'true' && github.event_name == 'pull_request' }}
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: ${{ inputs.fail-on-severity }}
        fail-on-scopes: ${{ inputs.fail-on-scopes }}
        allow-licenses: ${{ inputs.allow-licenses }}
        deny-licenses: ${{ inputs.deny-licenses }}
        allow-dependencies-licenses: ${{ inputs.allow-dependencies-licenses }}
