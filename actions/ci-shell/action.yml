# Composite action: Shell script CI checks.
#
# Runs ShellCheck on all tracked shell scripts and Bash syntax validation for
# repos with shell scripts in standard script directories.
#
# Usage:
#
#   jobs:
#     CI:
#       name: CI
#       runs-on: ubuntu-latest
#       timeout-minutes: 10
#       steps:
#         - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
#           with:
#             fetch-depth: 0
#         - uses: ForgingAlpha/.github/actions/ci-shell@v1

name: CI Shell
description: "Shell CI: shellcheck + bash syntax validation"

inputs:
  shellcheck-severity:
    description: "Minimum severity for shellcheck (error|warning|info|style)"
    required: false
    default: "style"
  markdown-mode:
    description: "Markdown lint mode for ci-markdown (changed|all)"
    required: false
    default: "changed"
  github-actions-mode:
    description: "GitHub Actions safety mode (changed|all)"
    required: false
    default: "changed"

runs:
  using: composite
  steps:
    - name: Enforce merge flow
      if: ${{ github.repository != 'ForgingAlpha/.github' }}
      uses: ForgingAlpha/.github/actions/ci-merge-flow@v1

    - name: Validate Alpha Apps policy
      if: ${{ github.repository != 'ForgingAlpha/.github' }}
      uses: ForgingAlpha/.github/actions/ci-alphaapps-policy@v1

    - name: Validate Markdown
      if: ${{ github.repository != 'ForgingAlpha/.github' }}
      uses: ForgingAlpha/.github/actions/ci-markdown@v1
      with:
        mode: ${{ inputs.markdown-mode }}

    - name: Plan GitHub Actions safety gate
      id: github_actions_safety
      shell: bash
      env:
        BASE_REF: ${{ github.base_ref }}
        EVENT_BEFORE: ${{ github.event.before }}
        EVENT_NAME: ${{ github.event_name }}
        GITHUB_ACTIONS_MODE: ${{ inputs.github-actions-mode }}
        REPOSITORY: ${{ github.repository }}
      run: |
        set -euo pipefail

        emit_run() {
          echo "run=$1" >> "${GITHUB_OUTPUT}"
        }

        if [ "${REPOSITORY}" = "ForgingAlpha/.github" ]; then
          echo "✓ Skipping remote GitHub Actions safety gate for central repo self-CI."
          emit_run false
          exit 0
        fi

        case "${GITHUB_ACTIONS_MODE}" in
          changed|all)
            ;;
          *)
            echo "✗ Unsupported github-actions-mode '${GITHUB_ACTIONS_MODE}'."
            echo "  WHY: language composites support only changed or all for GitHub Actions safety."
            echo "  HOW: set github-actions-mode to changed or all."
            exit 1
            ;;
        esac

        if [ "${GITHUB_ACTIONS_MODE}" = "all" ]; then
          echo "✓ GitHub Actions safety gate enabled by github-actions-mode=all."
          emit_run true
          exit 0
        fi

        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "✗ GitHub Actions changed-file detection requires a Git checkout."
          echo "  WHY: github-actions-mode=changed must compare workflow/action files before resolving ci-github-actions."
          echo "  HOW: run actions/checkout with fetch-depth: 0 before this shared CI composite."
          exit 1
        fi

        range=""
        if [ "${EVENT_NAME}" = "pull_request" ] && [ -n "${BASE_REF}" ]; then
          if ! git rev-parse --verify --quiet "origin/${BASE_REF}" >/dev/null; then
            echo "✗ Cannot find origin/${BASE_REF} for GitHub Actions changed-file detection."
            echo "  WHY: github-actions-mode=changed compares the pull request with its base branch."
            echo "  HOW: set actions/checkout fetch-depth: 0 before this shared CI composite."
            exit 1
          fi
          range="origin/${BASE_REF}...HEAD"
        elif [ -n "${EVENT_BEFORE}" ] && [ "${EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then
          if ! git rev-parse --verify --quiet "${EVENT_BEFORE}^{commit}" >/dev/null; then
            echo "✗ Cannot find before SHA ${EVENT_BEFORE} for GitHub Actions changed-file detection."
            echo "  WHY: github-actions-mode=changed compares push changes before resolving ci-github-actions."
            echo "  HOW: set actions/checkout fetch-depth: 0 before this shared CI composite."
            exit 1
          fi
          range="${EVENT_BEFORE}..HEAD"
        elif git rev-parse --verify --quiet "HEAD^" >/dev/null; then
          range="HEAD^..HEAD"
        else
          echo "✓ Single-commit checkout without a comparison base; running GitHub Actions safety gate."
          emit_run true
          exit 0
        fi

        workflow_action_paths=(
          ".github/workflows/*.yml"
          ".github/workflows/*.yaml"
          "action.yml"
          "action.yaml"
          "actions/*/action.yml"
          "actions/*/action.yaml"
          ".github/actions/*/action.yml"
          ".github/actions/*/action.yaml"
        )
        if ! changed_paths="$(git diff --name-only --diff-filter=ACMR "${range}" -- "${workflow_action_paths[@]}")"; then
          echo "✗ Failed to compute changed workflow/action files."
          echo "  WHAT: git diff failed for comparison range ${range}."
          echo "  WHY: github-actions-mode=changed must fail closed before deciding whether to run ci-github-actions."
          echo "  HOW: verify the comparison ref is fetched and rerun with actions/checkout fetch-depth: 0."
          exit 1
        fi

        changed=false
        while IFS= read -r path; do
          [ -n "${path}" ] || continue
          changed=true
          break
        done <<<"${changed_paths}"

        if [ "${changed}" = true ]; then
          echo "✓ GitHub workflow or action files changed; running GitHub Actions safety gate."
          emit_run true
        else
          echo "✓ No changed GitHub workflow or action files."
          emit_run false
        fi

    - name: Validate GitHub Actions safety
      if: ${{ steps.github_actions_safety.outputs.run == 'true' }}
      uses: ForgingAlpha/.github/actions/ci-github-actions@v1

    - name: Validate Dependabot coverage
      if: ${{ github.repository != 'ForgingAlpha/.github' }}
      uses: ForgingAlpha/.github/actions/ci-dependabot-coverage@v1

    - name: Run shell checks
      env:
        SHELLCHECK_SEVERITY: ${{ inputs.shellcheck-severity }}
      run: |
        set -euo pipefail

        case "${SHELLCHECK_SEVERITY}" in
          error|warning|info|style)
            ;;
          *)
            echo "✗ Unsupported shellcheck severity '${SHELLCHECK_SEVERITY}'"
            echo "  WHY: ShellCheck supports only error, warning, info, or style severity levels."
            echo "  HOW: set shellcheck-severity to one of: error, warning, info, style."
            exit 1
            ;;
        esac

        if ! command -v shellcheck >/dev/null 2>&1; then
          echo "✗ ShellCheck is not installed on PATH."
          echo "  WHY: shared shell CI must run the caller's pinned or runner-provided ShellCheck binary without network package installation."
          echo "  HOW: install ShellCheck before ci-shell or use a runner image that includes shellcheck."
          exit 1
        fi

        if ! git rev-parse --is-inside-work-tree >/dev/null 2>&1; then
          echo "✗ ci-shell must run inside a Git checkout."
          echo "  WHY: shared shell CI scopes checks to tracked .sh/.bash files so generated and untracked files cannot change results."
          echo "  HOW: run actions/checkout before ForgingAlpha/.github/actions/ci-shell."
          exit 1
        fi

        shellcheck --version

        mapfile -d '' shell_files < <(git ls-files -z -- '*.sh' '*.bash')
        if [ "${#shell_files[@]}" -eq 0 ]; then
          echo "✓ No tracked .sh or .bash files found."
          exit 0
        fi

        fail=0
        for file in "${shell_files[@]}"; do
          if ! shellcheck -S "${SHELLCHECK_SEVERITY}" "$file"; then
            echo "✗ ShellCheck failed for ${file}"
            echo "  WHY: shared shell CI requires ShellCheck at ${SHELLCHECK_SEVERITY} severity."
            echo "  HOW: fix the finding above or document a narrow inline ShellCheck directive."
            fail=1
          fi

          if ! bash -n "$file"; then
            echo "✗ Bash syntax validation failed for ${file}"
            echo "  WHY: shared shell CI requires every tracked .sh/.bash file to parse before merge."
            echo "  HOW: run 'bash -n ${file}' locally and fix the reported syntax error."
            fail=1
          fi
        done
        exit "$fail"
      shell: bash
