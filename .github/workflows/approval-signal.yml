name: Approval Signal

on:
  pull_request_review:
    types: [submitted]

permissions: {}

jobs:
  signal:
    name: Record authorized approval event
    if: >-
      github.event.review.state == 'approved' &&
      github.event.review.user.login == 'leosmigel' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Emit unprivileged signal
        shell: bash
        run: echo "Authorized approval event received; protected activation will independently revalidate current GitHub state."
