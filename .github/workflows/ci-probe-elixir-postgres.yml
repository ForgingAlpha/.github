name: CI Probe Elixir Postgres

on:
  workflow_call:
    inputs:
      checkout_ref:
        description: Target code ref to inspect with this trusted reusable workflow
        required: true
        type: string
      probe_mode:
        description: Diagnostic selector mode
        required: true
        type: string
      lane:
        description: Repo-owned diagnostic lane
        required: true
        type: string
      allowed_lanes:
        description: Comma or newline separated repo-owned lane allowlist
        required: true
        type: string
      file:
        description: Repo-relative test file for file or exact mode
        required: false
        type: string
        default: ""
      line:
        description: Positive test line for exact mode
        required: false
        type: string
        default: ""
      out_label:
        description: Safe artifact label
        required: false
        type: string
        default: probe
      file_root:
        description: Allowed repo-relative root for file selectors
        required: false
        type: string
        default: test
      file_suffixes:
        description: Comma or newline separated allowed file suffixes
        required: false
        type: string
        default: .exs
      postgres_image:
        description: Reviewed Postgres service image chosen by the caller workflow
        required: false
        type: string
        default: postgres:16
      postgres_initdb_args:
        description: Caller-owned PostgreSQL initialization arguments
        required: false
        type: string
        default: ""
      artifact_retention_days:
        description: Diagnostic artifact retention in days
        required: false
        type: number
        default: 3

permissions:
  contents: read

concurrency:
  group: ci-probe-${{ github.repository }}-${{ inputs.checkout_ref }}-${{ inputs.probe_mode }}-${{ inputs.lane }}
  cancel-in-progress: false

jobs:
  probe:
    name: Diagnostic probe
    runs-on: ${{ vars.FAST_RUNNER_LABEL || 'blacksmith-2vcpu-ubuntu-2404' }}
    timeout-minutes: 30

    services:
      postgres:
        image: ${{ inputs.postgres_image }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
          POSTGRES_INITDB_ARGS: ${{ inputs.postgres_initdb_args }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      MIX_ENV: test
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    defaults:
      run:
        working-directory: consumer

    steps:
      - name: Bind defining workflow identity
        id: source
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          python3 -I -B - <<'PYTHON'
          import json, os, re, sys
          try:
              raw = os.environ['JOB_CONTEXT']
              assert len(raw.encode('utf-8')) <= 262144
              def unique(pairs):
                  value = {}
                  for key, item in pairs:
                      assert key not in value
                      value[key] = item
                  return value
              context = json.loads(raw, object_pairs_hook=unique)
              repo, sha, ref = (context[key] for key in ('workflow_repository', 'workflow_sha', 'workflow_ref'))
              assert repo == 'ForgingAlpha/.github'
              assert isinstance(sha, str) and re.fullmatch('[a-f0-9]{40}', sha)
              prefix = repo + '/.github/workflows/ci-probe-elixir-postgres.yml@'
              assert isinstance(ref, str) and ref.startswith(prefix)
              assert ref[len(prefix):] in ('refs/heads/main', sha)
              with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
                  out.write(f'repository={repo}\nsha={sha}\n')
          except (AssertionError, KeyError, TypeError, ValueError, OSError):
              sys.exit('WHAT: Defining workflow identity unavailable or invalid.\nWHY: Probe guard must match this workflow commit.\nHOW: Qualify native main/commit identity; no fallback is allowed.')
          PYTHON

      - name: Checkout coherent trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.source.outputs.repository }}
          ref: ${{ steps.source.outputs.sha }}
          path: probe-source
          persist-credentials: 'false'
          fetch-depth: 1

      - name: Validate probe selector
        id: guard
        shell: bash
        working-directory: ${{ github.workspace }}
        env:
          PROBE_MODE: ${{ inputs.probe_mode }}
          PROBE_LANE: ${{ inputs.lane }}
          PROBE_ALLOWED_LANES: ${{ inputs.allowed_lanes }}
          PROBE_FILE: ${{ inputs.file }}
          PROBE_LINE: ${{ inputs.line }}
          PROBE_OUT_LABEL: ${{ inputs.out_label }}
          PROBE_CHECKOUT_REF: ${{ inputs.checkout_ref }}
          PROBE_FILE_ROOT: ${{ inputs.file_root }}
          PROBE_FILE_SUFFIXES: ${{ inputs.file_suffixes }}
          PROBE_SOURCE: ${{ github.workspace }}/probe-source
          PROBE_SOURCE_SHA: ${{ steps.source.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$(git -C "${PROBE_SOURCE}" rev-parse HEAD)" != "${PROBE_SOURCE_SHA}" ]; then
            echo 'WHAT: Probe checking source differs from defining workflow commit.' >&2
            echo 'WHY: A later main must not replace this execution source.' >&2
            echo 'HOW: Restore the exact source checkout; no fallback is allowed.' >&2
            exit 1
          fi
          python3 -I -B "${PROBE_SOURCE}/actions/ci-remote-probe-guard/scripts/validate_probe_inputs.py" \
            --probe-mode "${PROBE_MODE}" \
            --lane "${PROBE_LANE}" \
            --allowed-lanes "${PROBE_ALLOWED_LANES}" \
            --file "${PROBE_FILE}" \
            --line "${PROBE_LINE}" \
            --out-label "${PROBE_OUT_LABEL}" \
            --checkout-ref "${PROBE_CHECKOUT_REF}" \
            --file-root "${PROBE_FILE_ROOT}" \
            --file-suffixes "${PROBE_FILE_SUFFIXES}"

      - name: Checkout target ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.guard.outputs.checkout_ref }}
          path: consumer
          persist-credentials: 'false'
          fetch-depth: 1

      - name: Install exact locked runtime
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          working_directory: consumer
          version: 2026.8.3
          install: true
          install_args: --locked
          cache: true

      - name: Record exact runtime
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          elixir_version="$(elixir -e 'IO.write(System.version())')"
          otp_version="$(elixir -e 'IO.write(System.otp_release())')"
          echo "elixir=${elixir_version}" >> "${GITHUB_OUTPUT}"
          echo "otp=${otp_version}" >> "${GITHUB_OUTPUT}"

      - name: Cache deps and build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            consumer/deps
            consumer/_build
          key: ${{ runner.os }}-${{ runner.arch }}-probe-mix-${{ steps.runtime.outputs.elixir }}-${{ steps.runtime.outputs.otp }}-${{ hashFiles('consumer/mise.lock', 'consumer/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-probe-mix-${{ steps.runtime.outputs.elixir }}-${{ steps.runtime.outputs.otp }}-

      - name: Install dependencies
        shell: bash
        run: mix deps.get

      - name: Run repo probe adapter
        shell: bash
        env:
          PROBE_MODE: ${{ steps.guard.outputs.probe_mode }}
          PROBE_LANE: ${{ steps.guard.outputs.lane }}
          PROBE_FILE: ${{ steps.guard.outputs.file }}
          PROBE_LINE: ${{ steps.guard.outputs.line }}
          CHECKOUT_REF: ${{ steps.guard.outputs.checkout_ref }}
          OUT_LABEL: ${{ steps.guard.outputs.out_label }}
          ARTIFACT_PATH: ${{ steps.guard.outputs.artifact_path }}
        run: |
          set -euo pipefail

          mkdir -p "${ARTIFACT_PATH}"
          {
            echo "## CI Probe"
            echo ""
            echo "- repository: \`${GITHUB_REPOSITORY}\`"
            echo "- mode: \`${PROBE_MODE}\`"
            echo "- lane: \`${PROBE_LANE}\`"
            echo "- checkout ref: \`${CHECKOUT_REF}\`"
            echo "- file: \`${PROBE_FILE:-n/a}\`"
            echo "- line: \`${PROBE_LINE:-n/a}\`"
            echo "- artifact path: \`${ARTIFACT_PATH}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

          if [ ! -x ./bin/ci-probe ]; then
            {
              echo "✗ Missing executable ./bin/ci-probe."
              echo "  WHAT: the reusable probe workflow could not find the repo-owned probe adapter."
              echo "  WHY: shared diagnostics validate inputs centrally, but each repo owns safe command mapping."
              echo "  HOW: add executable bin/ci-probe that handles --mode, --lane, --file, --line, and --out."
            } | tee "${ARTIFACT_PATH}/probe.log"
            exit 1
          fi

          ./bin/ci-probe \
            --mode "${PROBE_MODE}" \
            --lane "${PROBE_LANE}" \
            --file "${PROBE_FILE}" \
            --line "${PROBE_LINE}" \
            --out "${ARTIFACT_PATH}" \
            2>&1 | tee "${ARTIFACT_PATH}/probe.log"

      - name: Upload diagnostic packet
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-probe-${{ steps.guard.outputs.out_label }}
          path: consumer/${{ steps.guard.outputs.artifact_path }}
          if-no-files-found: warn
          retention-days: ${{ inputs.artifact_retention_days }}
