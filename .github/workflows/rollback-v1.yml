name: Roll Back v1

on:
  workflow_dispatch:
    inputs:
      rollout_tag:
        description: Existing immutable v1-rollout-* tag to restore
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: v1-rollout
  cancel-in-progress: false

jobs:
  rollback:
    name: Restore current channel
    runs-on: ubuntu-latest
    environment: v1-rollback
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Validate immutable target and historical CI
        id: validate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROLLOUT_TAG: ${{ inputs.rollout_tag }}
        run: |
          set -euo pipefail

          if [[ ! "${ROLLOUT_TAG}" =~ ^v1-rollout-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$ ]]; then
            echo "✗ rollout_tag must be an exact v1-rollout-<UTC timestamp>-<12 hex> tag."
            exit 1
          fi

          resolve_tag_commit() {
            local tag="$1"
            local object sha type
            object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${tag}" --jq '.object')"
            sha="$(jq -r '.sha' <<<"${object}")"
            type="$(jq -r '.type' <<<"${object}")"
            while [ "${type}" = "tag" ]; do
              object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object')"
              sha="$(jq -r '.sha' <<<"${object}")"
              type="$(jq -r '.type' <<<"${object}")"
            done
            [ "${type}" = "commit" ] || return 1
            printf '%s\n' "${sha}"
          }

          target_sha="$(resolve_tag_commit "${ROLLOUT_TAG}")" || {
            echo "✗ Rollback tag does not resolve to a commit."
            exit 1
          }
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          relationship="$(gh api "repos/${GITHUB_REPOSITORY}/compare/${target_sha}...${current_main}" --jq '.status')"
          case "${relationship}" in
            ahead|identical) ;;
            *)
              echo "✗ ${ROLLOUT_TAG} is not an ancestor of current main."
              exit 1
              ;;
          esac

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${target_sha}&branch=main&event=push&status=success&per_page=100" \
            > /tmp/ci-runs.json
          approved_ci="$(jq -c \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg sha "${target_sha}" \
            '[.[].workflow_runs[] | select(
              .path == ".github/workflows/ci.yml" and
              .event == "push" and
              .head_branch == "main" and
              .head_sha == $sha and
              .conclusion == "success" and
              .repository.full_name == $repo
            )] | sort_by(.run_attempt // 0, .created_at) | last // empty' \
            /tmp/ci-runs.json)"
          [ -n "${approved_ci}" ] || {
            echo "✗ ${ROLLOUT_TAG} lacks a successful approved main CI workflow run."
            exit 1
          }

          current_v1_object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v1" --jq '.object.sha')"
          current_v1_commit="$(resolve_tag_commit v1)" || {
            echo "✗ Current v1 does not resolve to a commit."
            exit 1
          }
          {
            echo "current_v1_commit=${current_v1_commit}"
            echo "current_v1_object=${current_v1_object}"
            echo "target_sha=${target_sha}"
          } >> "${GITHUB_OUTPUT}"

      - name: Restore v1 and record atomically
        id: restore
        shell: bash
        env:
          CURRENT_V1_COMMIT: ${{ steps.validate.outputs.current_v1_commit }}
          CURRENT_V1_OBJECT: ${{ steps.validate.outputs.current_v1_object }}
          ROLLOUT_TAG: ${{ inputs.rollout_tag }}
          TARGET_SHA: ${{ steps.validate.outputs.target_sha }}
        run: |
          set -euo pipefail
          [[ "${CURRENT_V1_OBJECT}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          [[ "${CURRENT_V1_COMMIT}" =~ ^[0-9a-f]{40}$ ]] || exit 1
          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          short_sha="${TARGET_SHA:0:12}"
          rollback_record="v1-rollback-${timestamp}-${short_sha}"
          git config user.name "forgingalpha-release"
          git config user.email "forgingalpha-release@users.noreply.github.com"
          git tag -a "${rollback_record}" "${TARGET_SHA}" \
            -m "Rolled v1 back at ${timestamp}" \
            -m "Repository: ${GITHUB_REPOSITORY}" \
            -m "Displaced SHA: ${CURRENT_V1_COMMIT}" \
            -m "Restored SHA: ${TARGET_SHA}" \
            -m "Immutable source: ${ROLLOUT_TAG}"
          git push --atomic \
            --force-with-lease="refs/tags/v1:${CURRENT_V1_OBJECT}" \
            origin \
            "${TARGET_SHA}:refs/tags/v1" \
            "refs/tags/${rollback_record}"
          echo "rollback_record=${rollback_record}" >> "${GITHUB_OUTPUT}"

      - name: Record rollback
        shell: bash
        env:
          DISPLACED_SHA: ${{ steps.validate.outputs.current_v1_commit }}
          ROLLBACK_RECORD: ${{ steps.restore.outputs.rollback_record }}
          ROLLOUT_TAG: ${{ inputs.rollout_tag }}
          TARGET_SHA: ${{ steps.validate.outputs.target_sha }}
        run: |
          {
            echo "## v1 rollback"
            echo
            echo "- displaced: \`${DISPLACED_SHA}\`"
            echo "- restored: \`${TARGET_SHA}\`"
            echo "- immutable source: \`${ROLLOUT_TAG}\`"
            echo "- immutable rollback record: \`${ROLLBACK_RECORD}\`"
            echo "- operator: \`${GITHUB_ACTOR}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
