name: Release

# When a semver tag like v1.2.3 is pushed, force-move the corresponding
# major tag (v1) to point at the same commit. Consumers pinned to @v1
# automatically receive the update.
#
# This is the pattern actions/checkout, actions/setup-node, and the
# rest of the first-party GitHub Actions use.

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read
  checks: read

jobs:
  update-major-tag:
    name: Update major version tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Verify tagged commit CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          checks_json="${RUNNER_TEMP:-/tmp}/tag-check-runs.json"
          gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" > "${checks_json}"

          conclusion="$(jq -r \
            '[.check_runs[] | select(.name == "CI")]
             | sort_by(.completed_at // .started_at // .created_at)
             | last
             | .conclusion // empty' "${checks_json}")"

          if [[ "${conclusion}" != "success" ]]; then
            echo "✗ Tagged commit ${GITHUB_SHA} does not have a successful CI check"
            echo "  WHY: release tags move consumer-facing major tags; self CI must pass before rollout."
            echo "  HOW: tag only a commit whose CI check succeeded; observed conclusion='${conclusion:-missing}'."
            exit 1
          fi

          echo "✓ Tagged commit ${GITHUB_SHA} passed CI"

      - name: Force-move major tag
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          major="${TAG%%.*}"
          echo "Moving ${major} to ${TAG} (commit ${GITHUB_SHA})"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -fa "${major}" -m "Pointing ${major} at ${TAG}"
          git push origin "${major}" --force
