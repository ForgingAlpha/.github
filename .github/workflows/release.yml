name: Roll Out v1

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact current green main SHA to roll out after bootstrap preconditions are verified
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: v1-rollout
  cancel-in-progress: false

jobs:
  rollout:
    name: Roll out current channel
    if: >-
      ${{ vars.V1_ROLLOUT_ENABLED == 'true' &&
          (github.event_name == 'workflow_dispatch' ||
           (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' &&
            github.event.workflow_run.head_branch == 'main')) }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout control plane
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Verify exact current main SHA
        id: verify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.workflow_run.head_sha }}
          VERIFIED_RUN_ID: ${{ github.event.workflow_run.id }}
          VERIFIED_RUN_URL: ${{ github.event.workflow_run.html_url }}
        run: |
          set -euo pipefail

          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${VERIFIED_SHA}" != "${current_main}" ]; then
            echo "✗ Refusing stale rollout: verified=${VERIFIED_SHA} current-main=${current_main}"
            echo "  WHY: v1 may advance only to the newest green main commit."
            echo "  HOW: make the current main commit green; a later CI completion will retry."
            exit 1
          fi

          verified_run_url="${VERIFIED_RUN_URL}"
          if [ -n "${VERIFIED_RUN_ID}" ]; then
            run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${VERIFIED_RUN_ID}")"
            jq -e \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${VERIFIED_SHA}" \
              '.path == ".github/workflows/ci.yml" and
               .event == "push" and
               .head_branch == "main" and
               .head_sha == $sha and
               .conclusion == "success" and
               .repository.full_name == $repo' \
              <<<"${run_json}" >/dev/null || {
                echo "✗ Workflow-run evidence is not the approved successful main CI run for the rollout SHA."
                exit 1
              }
            verified_run_url="$(jq -r '.html_url' <<<"${run_json}")"
          else
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${VERIFIED_SHA}&branch=main&event=push&status=success&per_page=100" \
              > /tmp/ci-runs.json
            latest_ci="$(jq -c \
              --arg repo "${GITHUB_REPOSITORY}" \
              --arg sha "${VERIFIED_SHA}" \
              '[.[].workflow_runs[] | select(
                .path == ".github/workflows/ci.yml" and
                .event == "push" and
                .head_branch == "main" and
                .head_sha == $sha and
                .conclusion == "success" and
                .repository.full_name == $repo
              )] | sort_by(.run_attempt // 0, .created_at) | last // empty' \
              /tmp/ci-runs.json)"
            [ -n "${latest_ci}" ] || {
              echo "✗ Manual rollout SHA lacks a successful approved main CI workflow run."
              exit 1
            }
            verified_run_url="$(jq -r '.html_url' <<<"${latest_ci}")"
          fi

          resolve_object_commit() {
            local object="$1"
            local sha type depth=0
            while :; do
              sha="$(jq -er '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<<"${object}")" || return 1
              type="$(jq -er '.type' <<<"${object}")" || return 1
              if [ "${type}" = "commit" ]; then
                printf '%s\n' "${sha}"
                return 0
              fi
              [ "${type}" = "tag" ] && [ "${depth}" -lt 16 ] || return 1
              object="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${sha}" --jq '.object')" || return 1
              depth=$((depth + 1))
            done
          }
          resolve_tag_commit() {
            local object
            object="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/$1" --jq '.object')" || return 1
            resolve_object_commit "${object}"
          }
          # A successful complete enumeration distinguishes absence from a failed read.
          v1_pages="$(gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v1")"
          v1_refs="$(jq -ce '
            if type != "array" or (all(.[]; type == "array") | not) then error("invalid ref pages") else . end |
            if all(.[][]; type == "object" and (.ref | type == "string")) then . else error("invalid ref entry") end |
            [.[][] | select(.ref == "refs/tags/v1")] |
            if length <= 1 then . else error("duplicate v1 ref") end' <<<"${v1_pages}")"
          previous_v1_object=""
          previous_v1_commit=""
          if [ "$(jq 'length' <<<"${v1_refs}")" -eq 1 ]; then
            captured_object="$(jq -ce '.[0].object' <<<"${v1_refs}")"
            previous_v1_object="$(jq -er '.sha | select(type == "string" and test("^[0-9a-f]{40}$"))' <<<"${captured_object}")"
            previous_v1_commit="$(resolve_object_commit "${captured_object}")" || {
              echo "✗ Captured v1 object could not be resolved to a commit; no rollout is permitted."
              exit 1
            }
          fi
          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/git/matching-refs/tags/v1-rollout-" \
            > /tmp/prior-rollouts.json
          prior_tags="$(jq -er '
            if type != "array" or (all(.[]; type == "array") | not) then error("invalid rollout ref pages") else . end |
            [.[][] |
              if type == "object" and (.ref | type == "string") then .ref else error("invalid rollout ref entry") end |
              if test("^refs/tags/v1-rollout-[0-9]{8}T[0-9]{6}Z-[0-9a-f]{12}$") then ltrimstr("refs/tags/") else error("invalid rollout tag") end
            ] | join("\n")' /tmp/prior-rollouts.json)"
          prior_rollouts=0
          existing_rollout_tag=""
          while IFS= read -r prior_tag; do
            [ -n "${prior_tag}" ] || continue
            prior_sha="$(resolve_tag_commit "${prior_tag}")" || {
              echo "✗ Existing rollout tag ${prior_tag} does not resolve to a commit."
              exit 1
            }
            if [ "${prior_sha}" = "${VERIFIED_SHA}" ]; then
              prior_rollouts=$((prior_rollouts + 1))
              existing_rollout_tag="${prior_tag}"
            fi
          done <<<"${prior_tags}"
          if [ "${prior_rollouts}" -gt 0 ] && [ "${previous_v1_commit}" != "${VERIFIED_SHA}" ]; then
            echo "✗ ${VERIFIED_SHA} was already rolled out and v1 has since moved away."
            echo "  WHY: an Actions re-run must not silently undo an operator rollback."
            echo "  HOW: land a new reviewed commit on main; rolled-back SHAs cannot re-advance v1."
            exit 1
          fi

          already_complete=false
          if [ "${prior_rollouts}" -gt 0 ]; then
            already_complete=true
            rollout_tag="${existing_rollout_tag}"
          else
            timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
            short_sha="${VERIFIED_SHA:0:12}"
            rollout_tag="v1-rollout-${timestamp}-${short_sha}"
          fi

          {
            echo "already_complete=${already_complete}"
            echo "previous_v1_commit=${previous_v1_commit}"
            echo "previous_v1_object=${previous_v1_object}"
            echo "rollout_tag=${rollout_tag}"
            echo "verified_run_url=${verified_run_url}"
            echo "verified_sha=${VERIFIED_SHA}"
          } >> "${GITHUB_OUTPUT}"

      - name: Advance v1 and record atomically
        if: ${{ steps.verify.outputs.already_complete != 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PREVIOUS_V1_COMMIT: ${{ steps.verify.outputs.previous_v1_commit }}
          PREVIOUS_V1_OBJECT: ${{ steps.verify.outputs.previous_v1_object }}
          ROLLOUT_TAG: ${{ steps.verify.outputs.rollout_tag }}
          VERIFIED_RUN_URL: ${{ steps.verify.outputs.verified_run_url }}
          VERIFIED_SHA: ${{ steps.verify.outputs.verified_sha }}
        run: |
          set -euo pipefail
          git config user.name "forgingalpha-release"
          git config user.email "forgingalpha-release@users.noreply.github.com"
          git tag -a "${ROLLOUT_TAG}" "${VERIFIED_SHA}" \
            -m "Rolled v1 forward" \
            -m "Repository: ${GITHUB_REPOSITORY}" \
            -m "Previous v1 SHA: ${PREVIOUS_V1_COMMIT:-none}" \
            -m "Current v1 SHA: ${VERIFIED_SHA}" \
            -m "Verified CI: ${VERIFIED_RUN_URL}"
          current_main="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/main" --jq '.object.sha')"
          if [ "${current_main}" != "${VERIFIED_SHA}" ]; then
            echo "✗ Main moved after verification; refusing superseded rollout."
            exit 1
          fi
          # An empty expected-old value requires v1 still to be absent.
          git push --atomic \
            --force-with-lease="refs/tags/v1:${PREVIOUS_V1_OBJECT}" \
            origin \
            "${VERIFIED_SHA}:refs/tags/v1" \
            "refs/tags/${ROLLOUT_TAG}"

      - name: Record rollout
        shell: bash
        env:
          PREVIOUS_V1_COMMIT: ${{ steps.verify.outputs.previous_v1_commit }}
          ROLLOUT_TAG: ${{ steps.verify.outputs.rollout_tag }}
          VERIFIED_RUN_URL: ${{ steps.verify.outputs.verified_run_url }}
          VERIFIED_SHA: ${{ steps.verify.outputs.verified_sha }}
        run: |
          {
            echo "## v1 rollout"
            echo
            echo "- previous: \`${PREVIOUS_V1_COMMIT:-none}\`"
            echo "- current: \`${VERIFIED_SHA}\`"
            echo "- immutable record: \`${ROLLOUT_TAG}\`"
            echo "- verified CI: ${VERIFIED_RUN_URL}"
            echo "- actor: \`${GITHUB_ACTOR}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
