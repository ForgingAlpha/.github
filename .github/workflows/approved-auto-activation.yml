name: Activate Approved Change

on:
  pull_request_review:
    types: [submitted, dismissed]
  pull_request_target:
    types: [synchronize, converted_to_draft, labeled]

permissions:
  contents: read
  pull-requests: read

jobs:
  activate:
    uses: ./.github/workflows/approved-automerge.yml
    with:
      authorized_approver: leosmigel
      persistent_branches: main
      merge_method: merge
      hold_labels: hold-activation,no-merge
      release_app_id: ${{ vars.FORGINGALPHA_RELEASE_APP_ID }}
    secrets:
      release_app_private_key: ${{ secrets.FORGINGALPHA_RELEASE_APP_PRIVATE_KEY }}
