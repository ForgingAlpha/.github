name: Activate Approved Change

on:
  workflow_run:
    workflows: [Approval Signal]
    types: [completed]

permissions:
  contents: read
  pull-requests: read

jobs:
  activate:
    if: >-
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.pull_requests[0].number > 0
    uses: ./.github/workflows/approved-automerge.yml
    with:
      authorized_approver: leosmigel
      persistent_branches: main
      merge_method: merge
      pull_request_number: ${{ github.event.workflow_run.pull_requests[0].number }}
      release_app_client_id: ${{ vars.FORGINGALPHA_RELEASE_APP_CLIENT_ID }}
