name: Activate Approved Change

on:
  workflow_run:
    workflows: [Approval Signal]
    types: [completed]

permissions:
  pull-requests: read

jobs:
  activate:
    if: >-
      github.event.workflow_run.event == 'pull_request_review' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: ./.github/workflows/approved-automerge.yml
    with:
      authorized_approver: leosmigel
      persistent_branches: main
      merge_method: merge
      approval_head_sha: ${{ github.event.workflow_run.head_sha }}
