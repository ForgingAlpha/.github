name: Dependabot Auto-merge

on:
  pull_request:

permissions:
  contents: read

jobs:
  skip-nondependabot:
    name: Skip non-Dependabot PR
    if: ${{ github.actor != 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Explain skip
        run: echo "Dependabot auto-merge only runs for Dependabot PRs."

  call-dependabot-automerge:
    name: Enable auto-merge
    if: ${{ github.actor == 'dependabot[bot]' }}
    permissions:
      contents: write
      pull-requests: write
    uses: ./.github/workflows/dependabot-automerge-reusable.yml
    with:
      allow_patch: true
      allow_minor: true
      allow_major: false
      merge_method: squash
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
