name: Dependabot Auto-merge

on:
  pull_request:

permissions:
  contents: write
  pull-requests: write

jobs:
  call-dependabot-automerge:
    name: Enable auto-merge
    if: github.actor == 'dependabot[bot]'
    uses: ./.github/workflows/dependabot-automerge-reusable.yml
    with:
      allow_patch: true
      allow_minor: true
      allow_major: false
      merge_method: squash
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
