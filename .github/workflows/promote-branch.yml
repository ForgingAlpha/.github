name: Promote Branch

on:
  workflow_call:
    inputs:
      source_branch:
        description: Branch to promote from.
        required: false
        type: string
        default: dev
      target_branch:
        description: Branch to promote to.
        required: false
        type: string
        default: main
      source_sha:
        description: Exact already-green source SHA to promote; defaults to the current source branch head.
        required: false
        type: string
        default: ""
      required_checks:
        description: Comma-separated check names required on the source SHA.
        required: false
        type: string
        default: CI
      tag_prefix:
        description: Prefix for the annotated promotion tag.
        required: false
        type: string
        default: prod
      release_app_id:
        description: GitHub App ID for the release automation identity.
        required: true
        type: string
    secrets:
      release_app_private_key:
        description: GitHub App private key for the release automation identity.
        required: true

permissions:
  actions: read
  contents: read

concurrency:
  group: promote-${{ github.repository }}-${{ inputs.target_branch }}
  cancel-in-progress: false

jobs:
  promote:
    name: Fast-forward ${{ inputs.target_branch }} to ${{ inputs.source_branch }}
    runs-on: ubuntu-latest
    steps:
      - name: Mint release app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ inputs.release_app_id }}
          private-key: ${{ secrets.release_app_private_key }}
          permission-contents: write

      - name: Checkout target repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: true

      - name: Validate and promote
        shell: bash
        env:
          ACTIONS_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SOURCE_BRANCH: ${{ inputs.source_branch }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
          TARGET_BRANCH: ${{ inputs.target_branch }}
          REQUIRED_CHECKS: ${{ inputs.required_checks }}
          TAG_PREFIX: ${{ inputs.tag_prefix }}
        run: |
          set -euo pipefail

          fail() {
            local what="$1"
            local why="$2"
            local how="$3"
            echo "✗ ${what}" >&2
            echo "  WHY: ${why}" >&2
            echo "  HOW: ${how}" >&2
            exit 1
          }

          git check-ref-format --branch "${SOURCE_BRANCH}" >/dev/null \
            || fail \
              "Invalid source_branch '${SOURCE_BRANCH}'" \
              "promotion inputs must be valid Git branch names" \
              "pass a branch name accepted by 'git check-ref-format --branch'"
          git check-ref-format --branch "${TARGET_BRANCH}" >/dev/null \
            || fail \
              "Invalid target_branch '${TARGET_BRANCH}'" \
              "promotion inputs must be valid Git branch names" \
              "pass a branch name accepted by 'git check-ref-format --branch'"
          [[ "${TAG_PREFIX}" =~ ^[A-Za-z0-9][A-Za-z0-9._-]*$ ]] \
            || fail \
              "Invalid tag_prefix '${TAG_PREFIX}'" \
              "release tag names must not be interpreted as command options or ref syntax" \
              "use a simple alphanumeric, dot, underscore, or hyphen prefix"
          normalized_checks="$(printf '%s' "${REQUIRED_CHECKS}" | tr -d '[:space:]')"
          [[ "${normalized_checks}" == "CI" ]] \
            || fail \
              "Unsupported required_checks '${REQUIRED_CHECKS}'" \
              "privileged promotion requires the non-optional approved CI workflow" \
              "omit required_checks or set it to exactly CI"

          git fetch --prune origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"

          source_sha="$(git rev-parse "origin/${SOURCE_BRANCH}")"
          target_sha_before="$(git rev-parse "origin/${TARGET_BRANCH}")"

          if [[ -n "${REQUESTED_SOURCE_SHA}" ]]; then
            [[ "${REQUESTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] \
              || fail "Invalid source_sha" "promotion requires an immutable commit" "pass a full 40-character SHA"
            [[ "${source_sha}" == "${REQUESTED_SOURCE_SHA}" ]] \
              || fail \
                "${SOURCE_BRANCH} moved away from requested SHA ${REQUESTED_SOURCE_SHA}" \
                "only the exact tested source head may be promoted" \
                "rerun CI on the current source head and invoke promotion with that SHA"
          fi

          if [[ "${source_sha}" == "${target_sha_before}" ]]; then
            echo "✓ ${TARGET_BRANCH} already matches ${SOURCE_BRANCH} at ${source_sha}"
            {
              echo "## Promotion skipped"
              echo
              echo "\`${TARGET_BRANCH}\` already matches \`${SOURCE_BRANCH}\`."
              echo
              echo "- SHA: \`${source_sha}\`"
            } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          git merge-base --is-ancestor "origin/${TARGET_BRANCH}" "origin/${SOURCE_BRANCH}" \
            || fail \
              "${TARGET_BRANCH} is not an ancestor of ${SOURCE_BRANCH}" \
              "branch promotion must be fast-forward-only" \
              "merge or rebase ${SOURCE_BRANCH} so it contains origin/${TARGET_BRANCH}, then rerun promotion"

          GH_TOKEN="${ACTIONS_TOKEN}" gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${source_sha}&branch=${SOURCE_BRANCH}&event=push&status=success&per_page=100" \
            > /tmp/ci-runs.json
          ci_run="$(jq -c \
            --arg branch "${SOURCE_BRANCH}" \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg sha "${source_sha}" \
            '[.[].workflow_runs[] | select(
              .path == ".github/workflows/ci.yml" and
              .event == "push" and
              .head_branch == $branch and
              .head_sha == $sha and
              .conclusion == "success" and
              .repository.full_name == $repo
            )] | sort_by(.run_attempt // 0, .created_at) | last // empty' \
            /tmp/ci-runs.json)"
          [[ -n "${ci_run}" ]] \
            || fail \
              "Approved CI workflow has no successful push run for ${SOURCE_BRANCH} (${source_sha})" \
              "check names alone can be spoofed and do not prove trusted workflow provenance" \
              "run .github/workflows/ci.yml by push on the exact current source SHA"
          echo "✓ approved CI workflow passed on ${source_sha}"

          git config user.name "forgingalpha-release"
          git config user.email "forgingalpha-release@users.noreply.github.com"

          git fetch origin \
            "+refs/heads/${SOURCE_BRANCH}:refs/remotes/origin/${SOURCE_BRANCH}" \
            "+refs/heads/${TARGET_BRANCH}:refs/remotes/origin/${TARGET_BRANCH}"
          source_sha_now="$(git rev-parse "origin/${SOURCE_BRANCH}")"
          target_sha_now="$(git rev-parse "origin/${TARGET_BRANCH}")"
          [[ "${source_sha_now}" == "${source_sha}" ]] \
            || fail \
              "${SOURCE_BRANCH} moved after CI validation" \
              "promotion must carry the exact still-current tested source head" \
              "rerun promotion for the new source head after its required CI succeeds"
          [[ "${target_sha_now}" == "${target_sha_before}" ]] \
            || fail \
              "${TARGET_BRANCH} moved after validation" \
              "the expected-old target lease is stale" \
              "rerun promotion against the current target"

          timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
          tag="${TAG_PREFIX}-${timestamp}"
          git tag -a "${tag}" "${source_sha}" \
            -m "Promoted ${SOURCE_BRANCH} to ${TARGET_BRANCH} at ${timestamp}" \
            -m "Repository: ${GITHUB_REPOSITORY}" \
            -m "Source SHA: ${source_sha}" \
            -m "Previous ${TARGET_BRANCH} SHA: ${target_sha_before}"
          git push --atomic \
            --force-with-lease="refs/heads/${TARGET_BRANCH}:${target_sha_before}" \
            origin \
            "${source_sha}:refs/heads/${TARGET_BRANCH}" \
            "refs/tags/${tag}"

          {
            echo "## Promotion complete"
            echo
            echo "- Repository: \`${GITHUB_REPOSITORY}\`"
            echo "- Source branch: \`${SOURCE_BRANCH}\`"
            echo "- Target branch: \`${TARGET_BRANCH}\`"
            echo "- Previous target SHA: \`${target_sha_before}\`"
            echo "- Promoted SHA: \`${source_sha}\`"
            echo "- Tag: \`${tag}\`"
          } >> "${GITHUB_STEP_SUMMARY}"
