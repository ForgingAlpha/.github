name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Validate YAML
        run: |
          set -euo pipefail
          find actions -name "action.yml" -print -exec python3 -c "
          import yaml, sys
          try:
              yaml.safe_load(open(sys.argv[1]))
              print(\"  OK\")
          except yaml.YAMLError as e:
              print(f\"  FAIL: {e}\", file=sys.stderr)
              sys.exit(1)
          " {} \;
