name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      # Dogfood: exercise the merge-flow guard against this PR itself.
      # Uses a local path so the PR validates the in-branch version of the
      # action. Since `.github` has no `dev` branch, the guard should skip with
      # "merge flow policy does not apply".
      - name: Enforce merge flow (self)
        uses: ./actions/ci-merge-flow

      - name: Validate Alpha Apps policy
        uses: ./actions/ci-alphaapps-policy

      - name: Validate Markdown
        uses: ./actions/ci-markdown
        with:
          mode: all

      - name: Validate GitHub Actions safety
        uses: ./actions/ci-github-actions

      - name: Validate Dependabot coverage
        uses: ./actions/ci-dependabot-coverage

      - name: Validate Shell
        shell: bash
        run: |
          set -euo pipefail

          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "✗ ShellCheck is not installed on PATH."
            echo "  WHAT: parent CI cannot run shell validation because shellcheck is unavailable."
            echo "  WHY: shared shell validation requires ShellCheck at style severity before release."
            echo "  HOW: use a runner image with shellcheck installed or install it before this step."
            exit 1
          fi

          shellcheck --version

          mapfile -d '' shell_files < <(git ls-files -z -- '*.sh' '*.bash')
          if [ "${#shell_files[@]}" -eq 0 ]; then
            echo "✓ No tracked .sh or .bash files found."
            exit 0
          fi

          fail=0
          for file in "${shell_files[@]}"; do
            if ! shellcheck -S style "$file"; then
              echo "✗ ShellCheck failed for ${file}"
              echo "  WHY: parent self-CI must preserve the same style-severity shell policy published by ci-shell."
              echo "  HOW: fix the finding above or document a narrow inline ShellCheck directive."
              fail=1
            fi

            if ! bash -n "$file"; then
              echo "✗ Bash syntax validation failed for ${file}"
              echo "  WHY: parent self-CI requires every tracked .sh/.bash file to parse before merge."
              echo "  HOW: run 'bash -n ${file}' locally and fix the reported syntax error."
              fail=1
            fi
          done
          exit "$fail"

      - name: Test GitHub Actions contract validator
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests

      - name: Test GitHub Actions safety action
        run: |
          set -euo pipefail
          python3 -m unittest discover -s actions/ci-github-actions/tests

      - name: Test Markdown action
        run: |
          set -euo pipefail
          python3 -m unittest discover -s actions/ci-markdown/tests

      - name: Test Alpha Apps policy action
        run: |
          set -euo pipefail
          python3 -m unittest discover -s actions/ci-alphaapps-policy/tests

      - name: Test Dependency Review action
        run: |
          set -euo pipefail
          python3 -m unittest discover -s actions/ci-dependency-review/tests

      - name: Test Dependabot coverage action
        run: |
          set -euo pipefail
          python3 -m unittest discover -s actions/ci-dependabot-coverage/tests

      - name: Test Remote Probe Guard action
        run: |
          set -euo pipefail
          python3 -m unittest discover -s actions/ci-remote-probe-guard/tests
