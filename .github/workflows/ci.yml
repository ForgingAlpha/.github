name: CI
on:
  push:
    branches: [dev]
  pull_request:
    branches: [main, staging]

permissions:
  contents: read

jobs:
  CI:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6

      # Dogfood: exercise the merge-flow guard against this PR itself.
      # Uses a local path so the PR validates the in-branch version of the
      # action (rather than `@main`, which does not yet contain ci-merge-flow
      # until this PR merges). Since `.github` has no `dev` branch, the guard
      # should skip with "merge flow policy does not apply".
      - name: Enforce merge flow (self)
        uses: ./actions/ci-merge-flow

      - name: Validate YAML
        run: |
          set -euo pipefail
          find actions -name "action.yml" -print -exec python3 -c "
          import yaml, sys
          try:
              yaml.safe_load(open(sys.argv[1]))
              print(\"  OK\")
          except yaml.YAMLError as e:
              print(f\"  FAIL: {e}\", file=sys.stderr)
              sys.exit(1)
          " {} \;

      # actionlint: static analysis for GitHub Actions YAML (workflows +
      # composite actions). Catches the class of bug that wedged every
      # Rust repo on 2026-04-20 (broken `dtolnay/rust-toolchain@stable`
      # SHA resolution) plus shell-injection vectors, bad `uses:` refs,
      # and schema drift. Download-and-run keeps the image small and the
      # version transparent.
      - name: Install actionlint
        id: get_actionlint
        shell: bash
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)

      # actionlint's schema validation is scoped to workflow files
      # (`.github/workflows/*.yml`). Composite `action.yml` files have a
      # different schema (inputs/runs/composite) that actionlint parses as
      # malformed workflows. The earlier YAML validation step covers
      # action.yml syntax; `uses:` / schema issues in composite actions
      # surface at consumer CI time.
      - name: Run actionlint
        shell: bash
        run: |
          set -euo pipefail
          ${{ steps.get_actionlint.outputs.executable }} -color \
            .github/workflows/*.yml
