version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/actions/*"
    schedule:
      interval: "daily"
      time: "09:00"
      timezone: "America/New_York"
    cooldown:
      semver-patch-days: 3
      semver-minor-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
