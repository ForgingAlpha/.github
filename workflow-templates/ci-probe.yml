name: CI Probe

run-name: CI Probe ${{ inputs.probe_mode }} / ${{ inputs.lane }} / ${{ inputs.checkout_ref }}

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: Target code ref to inspect with the trusted default-branch workflow
        required: true
        type: string
      probe_mode:
        description: Diagnostic selector mode
        required: true
        type: choice
        options:
          - lane
          - file
          - exact
      lane:
        description: Repo-owned diagnostic lane
        required: true
        type: string
      file:
        description: Repo-relative file for file or exact mode
        required: false
        type: string
      line:
        description: Positive line for exact mode
        required: false
        type: string
      out_label:
        description: Safe artifact label
        required: false
        type: string
        default: probe

permissions:
  contents: read

jobs:
  probe:
    uses: ForgingAlpha/.github/.github/workflows/ci-probe-elixir-postgres.yml@main
    with:
      checkout_ref: ${{ inputs.checkout_ref }}
      probe_mode: ${{ inputs.probe_mode }}
      lane: ${{ inputs.lane }}
      file: ${{ inputs.file }}
      line: ${{ inputs.line }}
      out_label: ${{ inputs.out_label }}
      allowed_lanes: replace-with-repo-lane
      file_root: test
      file_suffixes: .exs
      elixir_version: replace-with-elixir-version
      otp_version: replace-with-otp-version
      postgres_image: postgres:16
